# 🤖 Kiểm tra main sau mỗi lần merge (CHARTER 6.5: main đỏ thì revert).
#
# Gọi tường minh bởi automerge.yml, vì merge bằng GITHUB_TOKEN không tự kích
# hoạt workflow khác. Lịch mỗi giờ là PHƯƠNG ÁN DỰ PHÒNG của giả định G2:
# nếu lời gọi tường minh không chạy được, main vẫn được kiểm trong vòng một giờ.
name: main-ci

on:
  workflow_dispatch:
    inputs:
      # P-010 · chế độ chạy thử. `pnpm check` vẫn chạy đủ — đó là toàn bộ
      # giá trị của file này — chỉ job `alert` là in ra issue nó ĐỊNH mở
      # thay vì mở. Không có chế độ này thì mỗi lần chạy thử trên một `main`
      # đang đỏ sẽ đẻ thêm một issue cảnh báo trùng.
      dry_run:
        description: 'Chạy thử: vẫn chạy pnpm check, nhưng in ra issue ĐỊNH mở thay vì mở'
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

# KF-004 issues: @nhắc nằm NGAY TRONG thân issue, không chờ notify.yml.
# Issue này do GITHUB_TOKEN mở, mà GitHub cố ý không kích hoạt workflow từ
# sự kiện do GITHUB_TOKEN tạo ra — nên notify.yml KHÔNG bao giờ chạy cho nó.
# Một @nhắc trong thân issue sinh thông báo của chính GitHub, không cần
# mắt xích thứ hai nào. Xem KF-004.

concurrency:
  group: main-ci
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `D-C07` · giữ lại đầu ra của `pnpm check` để job `alert` dựng được
      # phạm vi sự cố ở dạng máy đọc. `tee` giữ nguyên đầu ra trên log job,
      # và `pipefail` (đặt ở dòng đầu, Z10) giữ nguyên mã thoát của `pnpm`
      # chứ không lấy mã thoát của `tee` — không có nó thì job này XANH GIẢ
      # trên một `main` đỏ, đúng nhóm Z.
      - id: run
        run: |
          set -euo pipefail
          pnpm check 2>&1 | tee "$RUNNER_TEMP/check-output.txt"
      - name: Giữ đầu ra pnpm check cho job alert (D-C07)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-ci-check-output
          path: ${{ runner.temp }}/check-output.txt
          if-no-files-found: warn
          retention-days: 7
      # Z3 (ops/known-failures.md nhóm Z): `ops/workflows/` chỉ có hiệu lực
      # SAU KHI sync-workflows.yml chép sang .github/workflows/. Nếu sync
      # ngừng chạy hoặc hỏng vì PAT hết hạn, bản CŨ trong .github/ vẫn chạy
      # và vẫn xanh — không có gì đỏ để báo điều đó. So hai thư mục ở đây.
      #
      # CHỈ chạy khi KHÔNG PHẢI sự kiện `push`: `push` vào main kích hoạt cả
      # main-ci lẫn sync-workflows.yml cùng lúc, không có gì bảo đảm workflow
      # nào xong trước — so ngay lúc đó sẽ đỏ giả sau một merge bình thường.
      # Lịch mỗi giờ của job này (xem chú thích đầu file) đủ để bắt một lần
      # sync hỏng thật trong vòng một giờ.
      - name: Đối chiếu ops/workflows/ với .github/workflows/ (Z3)
        if: github.event_name != 'push'
        run: node ops/scripts/check-workflows-synced.ts

  alert:
    name: alert
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # `D-C07` · ba bước dưới đây dựng PHẠM VI SỰ CỐ ở dạng máy đọc. Chúng
      # đứng trước bước mở issue vì khối phạm vi nằm trong thân issue: mốc
      # `<!-- crux-hotfix-scope -->` là hợp đồng giữa file này (bên ghi) và
      # `ops/invariants.hotfix-lane.ts` (bên đọc), và không bên nào đọc văn
      # xuôi tiếng Việt của cảnh báo.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # `@v4` cho khớp `upload-artifact@v4` ở job `check` và ở
      # `spike-canvas.yml` — repo chưa có tiền lệ nào dùng bản khác cho cặp
      # này, và một cặp lệch bản là chỗ hỏng chỉ lộ ra khi `main` đã đỏ.
      - uses: actions/download-artifact@v4
        with:
          name: main-ci-check-output
          path: ${{ runner.temp }}/check
        # Z9 · nuốt lỗi ở đây là an toàn và CÓ CHỦ Ý: artifact vắng chỉ làm
        # phạm vi sự cố rỗng (tức "không có lối nhanh", hướng an toàn của
        # `D-C07`), còn việc chính của job này — mở cảnh báo `main` đỏ — không
        # phụ thuộc nó. Để bước này đỏ thì một `main` đỏ sẽ KHÔNG có cảnh báo
        # nào, đổi một bất tiện lấy một chỗ im lặng.
        continue-on-error: true
      - name: Dựng phạm vi sự cố cho lối đi nhanh hotfix (D-C07)
        id: scope
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Artifact vắng (job `check` chết trước khi ghi, hoặc tải về hỏng)
          # thì phạm vi RỖNG, không phải lỗi: `parseScope` coi phạm vi rỗng là
          # "sự cố này không có lối nhanh", nên hướng an toàn tự giữ. Cảnh báo
          # vẫn phải mở — đó mới là việc chính của job này.
          OUT="$RUNNER_TEMP/check/check-output.txt"
          [ -f "$OUT" ] || : > "$OUT"
          BLOCK=$(node ops/scripts/main-red-scope.ts "$OUT" "$SHA")
          {
            echo 'block<<CRUX_SCOPE_EOF'
            echo "$BLOCK"
            echo 'CRUX_SCOPE_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "$BLOCK"

      # Main đỏ được revert ngay; việc sửa làm lại trên nhánh. Issue này là
      # thứ routine crux-integrator đọc ở lần chạy kế tiếp.
      #
      # D-C06 · @NHẮC CÓ ĐỘ TRỄ. Lần đỏ đầu tiên KHÔNG @nhắc chủ dự án: nhà
      # máy có một cơ chế tự sửa (integrator revert, CHARTER 6.5 và phụ lục
      # P3) và nó chạy mỗi giờ. Gọi người ngay ở phút đầu là gọi người cho
      # một việc mà máy sắp tự làm xong.
      #
      # Chỉ khi `main` còn đỏ sau 2 GIỜ — tức là cơ chế tự sửa đã có ít nhất
      # một lượt và không xong — thì đây mới thành một trong bốn cảnh báo
      # khẩn của CHARTER 2.4, và lúc đó mới @nhắc, đúng một lần.
      - name: Mở issue main đỏ, @nhắc khi quá 2 giờ
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: HungQuach301
          SHA: ${{ github.sha }}
          MARKER: '<!-- crux-escalate-main-do -->'
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SCOPE_BLOCK: ${{ steps.scope.outputs.block }}
        run: |
          set -euo pipefail
          TITLE="[CẢNH BÁO] main đỏ tại ${SHA:0:7}"
          EXISTING=$(gh issue list --repo "$REPO" --label alert --state open \
            --search "main đỏ in:title" --json number,createdAt \
            --jq '.[0] | select(.) | "\(.number)\t\(.createdAt)"')
          BODY=$(printf '%s\n' \
            "🤖 \`main\` đang đỏ." \
            "" \
            "\`pnpm check\` đỏ trên \`main\` tại commit \`$SHA\`." \
            "" \
            "Nhật ký lần chạy: $RUN" \
            "" \
            "Việc tiếp theo, theo CHARTER 6.5 và phụ lục P3:" \
            "1. Tìm commit gây đỏ trong các lần merge 24 giờ qua." \
            "2. Mở PR revert trên nhánh \`claude/integration/revert-${SHA:0:7}\`. Nhãn cửa merge: CHẠY \`node ops/invariants.protected-area.ts\` trên diff của PR rồi lấy trường \`gate\`, đừng đoán — một bản revert chạm \`ops/workflows/**\` ra \`automerge-delayed\`, không phải \`automerge\`." \
            "3. Nếu PR đó chỉ chạm đúng các file trong khối \`crux-hotfix-scope\` dưới đây, gắn THÊM nhãn \`hotfix\`: lối đi nhanh của \`D-C07\` bỏ khoảng chờ 12 giờ cho đúng ca này. Chạm tầng luật đang bắt lỗi thì KHÔNG dùng lối nhanh — mở \`🤖 [QĐ]\`." \
            "4. Ghi vào \`ops/known-failures.md\`, và thêm một mục \`fix\` vào backlog của làn gây lỗi." \
            "" \
            "Không sửa trực tiếp trên \`main\`. Việc sửa làm lại trên nhánh." \
            "" \
            "Phạm vi sự cố, do \`ops/scripts/main-red-scope.ts\` dựng — đây là nguồn DUY NHẤT cho điều kiện 2 của \`D-C07\`, và \`ops/invariants.hotfix-lane.ts\` đọc đúng khối này:" \
            "" \
            "$SCOPE_BLOCK")

          # Chạy thử dừng ở đây: `pnpm check` của job `check` đã chạy thật
          # và đã đỏ (job này chỉ chạy khi `failure()`), nên phép thử đã có
          # kết quả. Chỉ thao tác ghi ra ngoài là bị chặn.
          if [ "$DRY_RUN" = "true" ]; then
            printf 'CHẠY THỬ — KHÔNG mở và KHÔNG bình luận issue nào.\nĐỊNH %s:\n────────\n%s\n' \
              "$([ -n "$EXISTING" ] && echo "bình luận vào issue #$(echo "$EXISTING" | cut -f1)" || echo "mở issue \"$TITLE\"")" \
              "$BODY"
            exit 0
          fi

          if [ -z "$EXISTING" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --label alert --body "$BODY"
            echo "Mở issue main đỏ. CHƯA @nhắc: máy còn 2 giờ để tự revert (D-C06)."
            exit 0
          fi

          NUM=$(echo "$EXISTING" | cut -f1)
          CREATED=$(echo "$EXISTING" | cut -f2)
          gh issue comment "$NUM" --repo "$REPO" --body "$BODY"

          AGE=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 3600 ))
          echo "main đã đỏ $AGE giờ (ngưỡng @nhắc: 2)."
          if [ "$AGE" -lt 2 ]; then
            echo "Chưa tới ngưỡng. Không @nhắc."
            exit 0
          fi
          if gh issue view "$NUM" --repo "$REPO" --json comments --jq '.comments[].body' \
              | grep -qF "$MARKER"; then
            echo "Đã @nhắc rồi. Không nhắc lại."
            exit 0
          fi
          gh issue comment "$NUM" --repo "$REPO" --body "$(printf '%s\n' \
            "$MARKER" \
            "@$OWNER \`main\` đã đỏ $AGE giờ mà máy chưa tự sửa được." \
            "" \
            "Đây là một trong bốn cảnh báo khẩn của CHARTER 2.4 — bốn loại đó là thứ duy nhất được phép gọi anh ngoài bản tin sáng.")"
