# 🤖 Merge tự động (CHARTER 3.3, bất biến I2 và I4; quyết định D-C06).
#
# Agent KHÔNG BAO GIỜ merge. Agent chỉ gắn nhãn. File này merge.
#
# Kích hoạt bằng `workflow_run`, nên nó luôn chạy theo định nghĩa trên main:
# nhánh PR không sửa được nó. Đó là toàn bộ lý do dùng workflow_run thay vì
# pull_request. Từ D-C06 có thêm lịch mỗi giờ, vì hàng chờ 12 giờ của nhãn
# `automerge-delayed` không tự tới hạn bằng một sự kiện nào cả.
#
# Ba cửa, quyết định ở `ops/invariants.merge-gate.ts`:
#
#   owner-merge        · máy không bao giờ merge
#   automerge-delayed  · nhãn `automerge-delayed`, merge sau 12 giờ CI xanh,
#                        trừ khi chủ dự án comment `dừng`
#   open               · nhãn `automerge`, merge ngay
#
# Từ `D-C07` có thêm LỐI ĐI NHANH cho cửa `automerge-delayed`: nhãn `hotfix`
# bỏ được khoảng chờ 12 giờ khi `main` đang đỏ và PR chỉ sửa đúng file mà
# cảnh báo khẩn nêu tên. Sáu điều kiện nằm ở `ops/invariants.hotfix-lane.ts`;
# lối nhanh KHÔNG bỏ phép kiểm nào khác, và không bao giờ áp cho chính file
# này (điều kiện 5).
#
# CỬA được tính lại ở đây bằng `ops/invariants.protected-area.ts` BẢN TRÊN
# MAIN, không lấy từ nhãn. Nhãn do `ci.yml` gắn, mà `ci.yml` chạy theo định
# nghĩa trong nhánh PR — một PR sửa `ci.yml` sẽ không bị nhãn nào chặn. Đó
# là rà soát Z8 trong `ops/known-failures.md`.
name: automerge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      # P-010 · chế độ chạy thử, và là chế độ DUY NHẤT mà
      # `smoke-workflows.yml` được phép gọi file này. Hàng rào nằm ở phía
      # gọi, hai lớp độc lập trong `ops/scripts/smoke-workflows.ts`:
      # `NEVER_REAL_DISPATCH` bắt theo tên file, `MERGE_PATTERNS` bắt theo
      # nội dung. Thiếu `dry_run` ở đây thì bên gọi TỪ CHỐI gọi, chứ không
      # rơi về chế độ thật — xem `planSmokeRuns` nhánh `refused`.
      dry_run:
        description: 'Chạy thử: xét đủ hàng đợi, in ra PR ĐỊNH merge, KHÔNG merge gì'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  # `KF-017`: bước "Xét từng PR" đọc check run `fix-has-test` qua Checks API
  # (`repos/…/commits/$HEAD/check-runs`, mục `P-009`). Scope `checks` là RIÊNG —
  # ba quyền trên đều không bao nó. Thiếu dòng này thì `gh api` trả 403 ngay ở
  # PR ĐẦU hàng đợi, `set -euo pipefail` giết cả bước, và không PR nào merge
  # được. Đo được: 35 lượt đỏ liên tiếp, 14:45Z → 20:38Z ngày 2026-09-22.
  checks: read
  # `D-C07`: bước xét lối nhanh `hotfix` đọc issue cảnh báo đang mở (`gh issue
  # list` + `gh issue view`) để lấy khối phạm vi. `issues` là scope RIÊNG, các
  # quyền trên không bao nó — thiếu dòng này thì `set -euo pipefail` giết cả
  # bước ở PR đầu hàng đợi, đúng chữ ký `KF-017`.
  issues: read

# KF-004 push: merge ở đây sinh sự kiện `push` vào main, mà `main-ci.yml`,
# `labels.yml`, `smoke-workflows.yml` và `.github/workflows/sync-workflows.yml`
# đăng ký nghe. Cả bốn được gọi TƯỜNG MINH ở bước cuối job, theo danh sách mà
# `ops/invariants.post-merge-dispatch.ts` trả về.
#
# Trước D-C06, `ops/workflows/**` nằm trọn trong vùng `owner-merge`, nên
# `sync-workflows` an toàn NHỜ phạm vi vùng bảo vệ chứ không nhờ thiết kế —
# chỉ merge của NGƯỜI mới chạm được thư mục đó, và merge của người sinh sự
# kiện thật. D-C06 chuyển thư mục đó sang `automerge-delayed`, tức là máy
# merge được, tức là đường đó đã đứt. Vì vậy lời gọi `sync-workflows` bây
# giờ là BẮT BUỘC, và có test riêng ở `ops/test/invariants-post-merge-dispatch.test.ts`.

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    name: merge
    runs-on: ubuntu-latest
    # Chạy theo lịch và khi gọi tay thì không có `workflow_run` để xét. Chạy
    # sau CI thì chỉ quan tâm lần CI của một pull request đã xong.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lập danh sách PR ứng viên
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Mọi PR mở mang một trong hai nhãn tự merge. Lấy cả hàng đợi ở
          # mọi lần chạy, kể cả lần chạy do CI của MỘT PR kích hoạt: một PR
          # đang chờ 12 giờ không có sự kiện nào của riêng nó để tới hạn.
          NUMS=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | select(.labels | map(.name) | (index("automerge") != null or index("automerge-delayed") != null)) | .number' \
            | tr '\n' ' ')
          echo "Ứng viên: ${NUMS:-(không có)}"
          echo "nums=$NUMS" >> "$GITHUB_OUTPUT"

      - name: Xét từng PR rồi merge cái nào tới lượt
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: HungQuach301
          NUMS: ${{ steps.queue.outputs.nums }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/automerge"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          MERGED=""

          if [ -z "${NUMS// /}" ]; then
            echo "Không có PR nào mang nhãn tự merge. Kết thúc."
            echo "merged=" >> "$GITHUB_OUTPUT"
            echo "merged_hotfix=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── D-C07 · dữ liệu của lối đi nhanh `hotfix` ─────────────────────
          #
          # Dựng MỘT LẦN cho cả hàng đợi, không dựng lại trong vòng lặp: cả
          # ba thứ dưới đây là trạng thái của SỰ CỐ, không phải của từng PR.
          #
          # Điều kiện 1 · `main-ci` gần nhất trên `main` có đỏ không. Không có
          # lần chạy nào thì coi như KHÔNG đỏ — hướng an toàn là cửa thường.
          MAIN_CI_RUN=$(gh api "repos/$REPO/actions/workflows/main-ci.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] // {} | {conclusion: (.conclusion // ""), sha: (.head_sha // "")}')
          MAIN_CI=$(echo "$MAIN_CI_RUN" | jq -r .conclusion)
          INCIDENT_SHA=$(echo "$MAIN_CI_RUN" | jq -r .sha)
          if [ "$MAIN_CI" = "success" ] || [ -z "$MAIN_CI" ]; then
            MAIN_CI_RED=false
            INCIDENT_SHA=""
          else
            MAIN_CI_RED=true
          fi
          echo "D-C07 · main-ci gần nhất: ${MAIN_CI:-(chưa có lần chạy nào)} tại ${INCIDENT_SHA:-—} → mainCiRed=$MAIN_CI_RED"

          # Điều kiện 1 (vế cảnh báo) · thân issue `alert` đang mở, NỐI với
          # những comment do `github-actions[bot]` viết — và CHỈ những comment
          # đó.
          #
          # ⚠️ Lọc tác giả KHÔNG tuỳ chọn (bất biến I7, `CLAUDE.md` mục 5).
          # `parseScope` lấy khối phạm vi MỚI NHẤT và không biết ai viết nó.
          # Agent comment được lên issue cảnh báo bằng danh tính chủ dự án —
          # bước 0 vẫn ghi ghi chú ở đó — nên nối cả comment của agent vào là
          # cho một comment ĐỊNH NGHĨA LẠI điều kiện 2, tức tự cấp quyền cho
          # chính mình. Vòng soát ngữ cảnh sạch tái hiện được đúng ca đó: một
          # khối tự viết với `files: ["CHARTER.md", ...]` ra `lane: "hotfix"`.
          # `github-actions[bot]` là tác giả duy nhất mà agent không giả được:
          # chỉ workflow chạy theo định nghĩa trên `main` viết dưới tên đó.
          ALERT_NUM=$(gh issue list --repo "$REPO" --label alert --state open \
            --search "main đỏ in:title" --json number,createdAt,author \
            --jq '[.[] | select(.author.login == "github-actions[bot]")]
                  | sort_by(.createdAt) | last | .number // ""')
          ALERT_BODY=""
          if [ -n "$ALERT_NUM" ]; then
            ALERT_BODY=$(gh issue view "$ALERT_NUM" --repo "$REPO" --json body,comments \
              --jq '[.body] + [.comments[] | select(.author.login == "github-actions[bot]") | .body]
                    | join("\n\n")')
          fi
          echo "D-C07 · cảnh báo đang mở: ${ALERT_NUM:-(không có)}"

          # Điều kiện 6 · mọi PR đang mở mang nhãn `hotfix`. Cửa chọn PR số
          # nhỏ nhất, nên danh sách này phải đủ, không chỉ PR đang xét.
          # `--paginate` cộng với một `--jq` trả MẢNG in ra một mảng CHO MỖI
          # TRANG (`[171] []`), và chuỗi đó không phải JSON hợp lệ — `--argjson`
          # dưới đây sẽ chết kéo cả bước theo `set -e`. Nên lấy DÒNG (như
          # bước dựng `NUMS` phía trên đã làm) rồi ghép mảng bằng `jq` một lần.
          HOTFIX_LIST=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | select(.labels | map(.name) | index("hotfix") != null) | .number' \
            | tr '\n' ' ')
          HOTFIX_PRS=$(jq -cn --arg list "$HOTFIX_LIST" \
            '$list | split(" ") | map(select(. != "")) | map(tonumber)')
          echo "D-C07 · PR mang nhãn hotfix: $HOTFIX_PRS"
          MERGED_HOTFIX=""

          for NUM in $NUMS; do
            echo "──────────── PR #$NUM"

            # GitHub tính `mergeable` bất đồng bộ và trả `null` khi chưa xong.
            # Hỏi lại vài lần; `null` KHÔNG BAO GIỜ được coi là merge được (KF-002).
            DATA=""
            for TRY in 1 2 3; do
              DATA=$(gh api "repos/$REPO/pulls/$NUM")
              [ "$(echo "$DATA" | jq -r '.mergeable // "null"')" != "null" ] && break
              echo "  mergeable chưa tính xong (lần $TRY), chờ 5 giây."
              sleep 5
            done

            HEAD=$(echo "$DATA" | jq -r .head.sha)

            # Cửa: tính lại từ đường dẫn, bằng bản trên main. Không tin nhãn.
            PR_DIR="$WORK/$NUM"
            mkdir -p "$PR_DIR/head"
            git fetch --no-tags --quiet origin main "+refs/pull/$NUM/head:refs/remotes/pr/$NUM"
            BASE=$(git merge-base origin/main "refs/remotes/pr/$NUM")
            git diff --name-only "$BASE" "refs/remotes/pr/$NUM" > "$PR_DIR/changed.txt"
            git archive "refs/remotes/pr/$NUM" | tar -x -C "$PR_DIR/head"
            # Z9: vắng CHARTER.md ở SHA nền là hợp lệ — protected-area.ts coi
            # đó là "không đối chiếu được" và trả cửa owner-merge (an toàn
            # nhất), không phải một lỗi cần chặn ở đây.
            git show "$BASE:CHARTER.md" > "$PR_DIR/base-CHARTER.md" 2>/dev/null || true
            AREA=$(node ops/invariants.protected-area.ts \
              --changed "$PR_DIR/changed.txt" \
              --head "$PR_DIR/head" \
              --base-charter "$PR_DIR/base-CHARTER.md")
            GATE=$(echo "$AREA" | jq -r .gate)
            echo "  cửa=$GATE · $(echo "$AREA" | jq -r '[.owner[], .delayed[]] | join(" · ") | if . == "" then "không chạm vùng bảo vệ" else . end')"

            # Mục `P-009`: `ciConclusion` của cả run KHÔNG đủ để biết job
            # `fix-has-test` đã xanh — job đó có thể `skipped` mà không làm
            # cả run đỏ. Đọc riêng check run này trên đúng $HEAD. Không có
            # check run nào tên đó (PR quá cũ, hoặc CI chưa từng chạy trên
            # commit này) thì để `null` — `invariants.merge-gate.ts` coi
            # `null` là "chưa kiểm", không phải "đã xanh".
            FIX_HAS_TEST=$(gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "fix-has-test" and .status == "completed")][0].conclusion // null')

            # Lối đi nhanh `hotfix` (D-C07, `ops/invariants.hotfix-lane.ts`).
            # Tính bằng bản trên `main` như mọi thứ khác trong file này, và in
            # ra kết luận cho MỌI PR — kể cả `normal` (cấm im lặng, rà soát Z2).
            # Danh sách file bị XOÁ, tách khỏi `changed`: một PR xoá đúng file
            # test đang làm cổng đỏ thì thoả điều kiện 2 một cách hoàn hảo mà
            # vẫn là "tắt test để CI xanh" (`CLAUDE.md` mục 13). `--name-only`
            # không phân biệt được, `--name-status` thì có.
            git diff --name-status "$BASE" "refs/remotes/pr/$NUM" \
              | awk '$1 ~ /^D/ { print $2 }' > "$PR_DIR/deleted.txt"

            jq -n \
              --argjson pr "$DATA" \
              --argjson hotfixPrs "$HOTFIX_PRS" \
              --arg alertBody "$ALERT_BODY" \
              --arg incidentSha "$INCIDENT_SHA" \
              --argjson mainCiRed "$MAIN_CI_RED" \
              --argjson number "$NUM" \
              '{labels: [$pr.labels[].name], changed: [], deleted: [], alertBody: $alertBody,
                incidentSha: $incidentSha, mainCiRed: $mainCiRed, otherHotfixPrs: $hotfixPrs,
                number: $number}' \
              > "$PR_DIR/hotfix-input.json"
            # `changed` đọc từ chính file mà bước tính cửa đã dựng — một nguồn
            # duy nhất cho "PR này đổi những gì", nên cửa và lối nhanh không
            # thể xét hai danh sách khác nhau.
            jq --rawfile changed "$PR_DIR/changed.txt" --rawfile deleted "$PR_DIR/deleted.txt" \
              '.changed = ($changed | split("\n") | map(select(. != "")))
               | .deleted = ($deleted | split("\n") | map(select(. != "")))' \
              "$PR_DIR/hotfix-input.json" > "$PR_DIR/hotfix-input.full.json"
            HOTFIX=$(node ops/invariants.hotfix-lane.ts "$PR_DIR/hotfix-input.full.json")
            echo "  lối nhanh=$(echo "$HOTFIX" | jq -r .lane) — $(echo "$HOTFIX" | jq -r .reason)"

            jq -n \
              --arg gate "$GATE" \
              --argjson hotfix "$HOTFIX" \
              --arg head "$HEAD" \
              --arg owner "$OWNER" \
              --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson pr "$DATA" \
              --argjson ci "$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD&status=completed&per_page=1" --jq '.workflow_runs[0] // {}')" \
              --arg fixHasTest "$FIX_HAS_TEST" \
              --argjson comments "$(gh pr view "$NUM" --repo "$REPO" --json comments --jq '[.comments[] | {author: .author.login, body: .body, createdAt: .createdAt}]')" \
              '{gate: $gate, labels: [$pr.labels[].name], draft: $pr.draft, mergeable: $pr.mergeable,
                mergeableState: $pr.mergeable_state, headSha: $head, ciSha: ($ci.head_sha // null),
                ciConclusion: ($ci.conclusion // null), ciCompletedAt: ($ci.updated_at // null),
                fixHasTestConclusion: (if $fixHasTest == "null" then null else $fixHasTest end),
                comments: $comments, owner: $owner, now: $now, delayHours: 12,
                hotfix: $hotfix}' > "$PR_DIR/state.json"

            DECISION=$(node ops/invariants.merge-gate.ts "$PR_DIR/state.json")
            OUTCOME=$(echo "$DECISION" | jq -r .outcome)
            # Cấm im lặng (rà soát Z2): mọi PR đều in ra kết luận của nó,
            # kể cả kết luận "không làm gì".
            echo "  $OUTCOME — $(echo "$DECISION" | jq -r .reason)"
            [ "$OUTCOME" != "merge" ] && continue

            # Chạy thử dừng ở ĐÚNG đây và không sớm hơn: mọi thứ phía trên
            # — hàng đợi, `mergeable` hỏi lại, tính lại cửa bằng
            # `invariants.protected-area.ts`, quyết định của
            # `invariants.merge-gate.ts` — đều đã chạy thật trên dữ liệu
            # thật. Chỉ một lệnh duy nhất bị chặn, và đó là lệnh duy nhất
            # không hoàn tác được.
            if [ "$DRY_RUN" = "true" ]; then
              echo "  CHẠY THỬ — ĐỊNH merge #$NUM (squash, sha $HEAD). KHÔNG merge."
              continue
            fi

            gh api -X PUT "repos/$REPO/pulls/$NUM/merge" \
              -f merge_method=squash \
              -f sha="$HEAD"
            echo "  đã merge #$NUM"
            MERGED="$MERGED $NUM"
            if [ "$(echo "$HOTFIX" | jq -r .lane)" = "hotfix" ]; then
              MERGED_HOTFIX="$MERGED_HOTFIX $NUM"
            fi
          done

          echo "merged=${MERGED# }" >> "$GITHUB_OUTPUT"
          echo "merged_hotfix=${MERGED_HOTFIX# }" >> "$GITHUB_OUTPUT"

      # Chế độ chạy thử không bao giờ tới được bước này: nó `continue`
      # trước khi ghi vào `MERGED`, nên `steps.merge.outputs.merged` rỗng và
      # điều kiện dưới đây sai. Đó là chủ đích — không merge thì cũng không
      # có sự kiện `push` nào để thay thế, nên gọi các workflow này ở chế độ
      # thử sẽ là gọi nhầm.
      # D-C07 điều kiện 6 · một PR đi lối nhanh thì chủ dự án được @nhắc NGAY
      # lúc merge, không chờ bản tin sáng. Lối nhanh là chỗ duy nhất máy đưa
      # một thay đổi vùng bảo vệ vào `main` mà không có khoảng chờ 12 giờ, nên
      # nó là chỗ duy nhất cần một dòng "việc này vừa xảy ra" tức thời.
      - name: '@nhắc chủ dự án về PR đã merge qua lối nhanh hotfix (D-C07)'
        if: steps.merge.outputs.merged_hotfix != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: HungQuach301
          MERGED_HOTFIX: ${{ steps.merge.outputs.merged_hotfix }}
        run: |
          set -euo pipefail
          for NUM in $MERGED_HOTFIX; do
            gh pr comment "$NUM" --repo "$REPO" --body "$(printf '%s\n' \
              "🤖 @$OWNER PR này vừa được merge qua **lối đi nhanh \`hotfix\`** (\`D-C07\`, câu trả lời của anh ở \`#169\`), tức KHÔNG chờ 12 giờ." \
              "" \
              "Sáu điều kiện đã được máy kiểm trước khi merge (\`ops/invariants.hotfix-lane.ts\`): \`main-ci\` đang đỏ, cảnh báo khẩn đang mở nêu đúng các file này, không chạm tầng luật đang bắt lỗi, không chạm hạ tầng merge, đủ 5 check xanh trên đúng đầu nhánh, và đây là PR \`hotfix\` duy nhất của sự cố." \
              "" \
              "Bản tin kế tiếp có một mục riêng cho lần merge này để anh soát lại.")"
          done

      - name: Gọi tay các workflow lẽ ra chạy theo sự kiện push
        if: steps.merge.outputs.merged != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED: ${{ steps.merge.outputs.merged }}
        # Merge bằng GITHUB_TOKEN KHÔNG tự kích hoạt workflow khác (giả định
        # G2, cùng cơ chế với KF-004). Danh sách phải gọi do
        # `ops/invariants.post-merge-dispatch.ts` quyết định — KHÔNG viết
        # cứng ở đây. Viết cứng nghĩa là thêm một workflow nghe `push` mà
        # quên sửa bash thì không có gì báo, và đó đúng là cách KF-004 xảy ra.
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/automerge"
          ALL="$WORK/merged-files.txt"
          : > "$ALL"
          for NUM in $MERGED; do
            cat "$WORK/$NUM/changed.txt" >> "$ALL"
          done

          while IFS=$'\t' read -r WF WHY; do
            [ -z "$WF" ] && continue
            echo "gọi $WF — $WHY"
            # Một PR vừa THÊM một workflow mới thì file đó chưa có trong
            # `.github/workflows/` — `sync-workflows` vừa được gọi ở vòng
            # trước và còn đang chạy. GitHub trả 404 cho `gh workflow run`
            # với một workflow chưa đăng ký, và dưới `set -e` điều đó làm
            # bước này đỏ SAU KHI đã merge xong: một job đỏ không nói lên
            # điều gì sai về lần merge.
            #
            # `|| true` ở đây là chủ ý (rà soát Z9), và KHÔNG im lặng: ca
            # này được in ra kèm đúng lý do, để lần chạy sau không phải đoán.
            if ! gh workflow run "$WF" --repo "$REPO" --ref main; then
              echo "::warning::gọi $WF không thành công — nhiều khả năng nó vừa được THÊM trong lượt merge này và sync-workflows chưa chép xong. Nó sẽ chạy ở lần ops/workflows/** đổi kế tiếp."
            fi
          done < <(node ops/invariants.post-merge-dispatch.ts "$ALL")
