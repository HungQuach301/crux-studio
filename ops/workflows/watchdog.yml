# 🤖 Người canh (CHARTER 2.4, rủi ro B7 và B13).
#
# Chạy theo lịch cron trong Actions, ĐỘC LẬP với Claude. Đó là điểm mấu chốt:
# nếu nhà máy đứng im vì Claude hỏng, hết hạn mức, hoặc routine bị tắt, thì
# không có gì bên trong Claude báo được. Workflow này ở ngoài.
name: watchdog

on:
  schedule:
    # Mỗi giờ, không phải mỗi 6 giờ — mục P-020 rút ngưỡng dấu hiệu số 5
    # (nhịp tim routine) xuống 3 giờ; workflow chỉ CHẤM lại tại thời điểm nó
    # tự chạy, nên nhịp cũ (mỗi 6 giờ) làm ngưỡng 3 giờ vô nghĩa — có thể
    # phát hiện muộn tới 6 giờ sau khi đã stale. Cùng lý do áp cho ngưỡng
    # PR-merge mới (6 giờ, dấu hiệu số 2): chấm mỗi giờ vẫn rẻ (vài giây gọi
    # API mỗi lần) và không spam vì issue cảnh báo được cập nhật bằng
    # comment, không tạo mới, khi vấn đề còn tồn tại.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Bắn một cảnh báo thử để kiểm đường thông báo tới điện thoại'
        type: boolean
        default: false
      # P-010 · chế độ chạy thử. Khác `test_alert` ở đúng một điểm và điểm
      # đó là tất cả: `test_alert` MỞ issue thật (nó kiểm đường thông báo);
      # `dry_run` soát đủ tám dấu hiệu rồi IN RA issue nó định mở, không mở.
      dry_run:
        description: 'Chạy thử: soát đủ tám dấu hiệu, in ra issue ĐỊNH mở, không mở issue nào'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

# KF-004 issues: @nhắc nằm NGAY TRONG thân issue, không chờ notify.yml.
# Đây là workflow quan trọng nhất phải báo được: nó là thứ duy nhất báo khi
# nhà máy đứng im vì Claude hỏng (rủi ro B7). Nếu nó phải nhờ một workflow
# thứ hai mới tới được điện thoại, thì nó có thêm đúng một chỗ để đứt — và
# nó ĐÃ đứt ở đúng chỗ đó. Xem KF-004.
  # pull-requests: read cho `gh pr list` ở dấu hiệu số 2 (không PR nào merge
  # trong 6 giờ). Đọc PR không nằm trong `contents: read`. Xem KF-003.
  pull-requests: read

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # P-034 · phần quyết định @nhắc nằm ở `ops/scripts/alert-escalation.ts`
      # (chạy thẳng file `.ts`, cần Node ≥ 22.18). Không `pnpm install`: script
      # đó chỉ dùng thư viện chuẩn, và một `install` ở đây là thêm một chỗ để
      # người canh chết đúng lúc nó phải lên tiếng.
      #
      # `continue-on-error` vì chính lý do đó áp cho cả bước này: nó đứng
      # TRƯỚC cả tám phép soát, nên nó hỏng (tool cache trượt, nodejs.org
      # không với tới được) là cả người canh câm — mất luôn bảy dấu hiệu
      # không dính gì tới Node. Runner đã có sẵn Node; thiếu bản đủ mới thì
      # `alert-escalation.ts` không chạy được, và bước quyết định dưới đã có
      # sẵn hướng an toàn cho ca đó: rơi về `mention`.
      - uses: actions/setup-node@v7
        # Z9 · nuốt lỗi ở đây là an toàn và CÓ CHỦ Ý: bước này đứng TRƯỚC cả
        # tám phép soát, nên để nó đỏ là để cả người canh câm — mất luôn bảy
        # dấu hiệu không dính gì tới Node. Runner đã có sẵn Node; thiếu bản
        # đủ mới thì `alert-escalation.ts` không chạy được, và bước quyết
        # định dưới đã có hướng an toàn cho đúng ca đó: rơi về `mention`.
        continue-on-error: true
        with:
          node-version: '22'

      # Dấu hiệu số 6 chạy `ops/scripts/lane-heartbeat.ts` — TypeScript chạy
      # thẳng bằng node ≥ 22.18, không cần `pnpm install`: script chỉ nhập
      # `kernel/src/*.ts`, không phụ thuộc gói nào.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Soát tám dấu hiệu im lặng
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: HungQuach301
          TEST: ${{ inputs.test_alert }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # P-034 · TIỀN TỐ của mốc "đã @nhắc lúc nào". Khác mốc của
          # `main-ci.yml` để hai cảnh báo không đếm nhầm nhịp của nhau.
          #
          # Chỉ là tiền tố, vì mốc đầy đủ còn mang vân tay của TẬP DẤU HIỆU
          # (xem chỗ dựng `MARKER` dưới). Workflow này gộp tám dấu hiệu vào
          # MỘT issue, mà CHARTER 2.4 đếm chúng là những loại cảnh báo khẩn
          # KHÁC nhau — "nhà máy im lặng" và "chi phí vượt 80% ngân sách" là
          # hai loại riêng. Một mốc dùng chung cho cả issue thì một dấu hiệu
          # MỚI xuất hiện lúc issue đang trong khoảng lặng 4 giờ sẽ chỉ đi
          # vào comment tình trạng và không gọi ai — tức là nó được đối xử
          # như một lần nhắc lại, trong khi nó là comment ĐẦU TIÊN của một
          # cảnh báo khẩn khác. Vân tay làm tập dấu hiệu đổi thành mốc đổi,
          # và mốc đổi thì `decideMention` thấy "chưa @nhắc lần nào" → gọi
          # ngay, đúng vế 1.
          MARKER_PREFIX: '<!-- crux-escalate-watchdog:'
          # P-043 · nhánh giữ BẢN SAO nhịp tim, để dấu hiệu số 5 đọc được mà
          # không cần một PR nào merge. Phải khớp nguyên văn hằng
          # `TELEMETRY_BRANCH` của `ops/scripts/telemetry-beat.ts`;
          # `ops/test/heartbeat-source.test.ts` đọc cả hai chỗ và so, nên hai
          # bản không lệch nhau im lặng được.
          TELEMETRY_BRANCH: 'claude/telemetry'
          # P-056 · tiền tố nhánh chờ của các lượt log-only. Phải khớp
          # nguyên văn hằng `STEP0_PENDING_BRANCH_PREFIX` của
          # `ops/scripts/step0-pr-gate.ts`; `ops/test/step0-pending-branches.test.ts`
          # đọc cả hai chỗ và so, nên hai bản không lệch nhau im lặng được.
          STEP0_PENDING_PREFIX: 'claude/integration/step0-pending'
        run: |
          set -euo pipefail
          NOW=$(date -u +%s)
          PROBLEMS=""

          add() { PROBLEMS="${PROBLEMS}- $1"$'\n'; }

          # 1 · Quá 26 giờ không có bản tin mới.
          LAST_DIGEST=$(gh issue list --repo "$REPO" --label digest --state all \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$LAST_DIGEST" ]; then
            add "Chưa có bản tin nào. Routine \`crux-digest\` đã được tạo chưa?"
          else
            AGE=$(( (NOW - $(date -u -d "$LAST_DIGEST" +%s)) / 3600 ))
            [ "$AGE" -gt 26 ] && add "Bản tin gần nhất cách đây $AGE giờ (ngưỡng 26). Routine \`crux-digest\` có thể đã dừng."
          fi

          # 2 · Quá 6 giờ không merge PR nào, trong khi backlog vẫn còn mục ready.
          #     Ngưỡng cũ 48 giờ — rút xuống 6 theo chỉ dẫn 4 của chủ dự án
          #     trên issue bản tin #17 (2026-09-21): với 3 worker chạy cách
          #     nhau 1-3 giờ, 48 giờ im lặng là quá muộn để còn kịp làm gì
          #     trong cùng ngày (mục P-020).
          LAST_MERGE=$(gh pr list --repo "$REPO" --state merged --limit 1 \
            --json mergedAt --jq '.[0].mergedAt // empty')
          READY=$(grep -rl 'status: ready' ops/lanes/*/backlog.md 2>/dev/null | wc -l)
          if [ "$READY" -gt 0 ]; then
            if [ -z "$LAST_MERGE" ]; then
              add "Chưa có PR nào được merge, trong khi backlog còn mục \`ready\` ở $READY làn."
            else
              AGE=$(( (NOW - $(date -u -d "$LAST_MERGE" +%s)) / 3600 ))
              [ "$AGE" -gt 6 ] && add "Không có PR nào merge trong $AGE giờ (ngưỡng 6), trong khi backlog còn mục \`ready\` ở $READY làn."
            fi
          fi

          # 3 · Lần chạy gần nhất của sync-workflows thất bại.
          #     Nguyên nhân thường gặp nhất: PAT WORKFLOW_SYNC_TOKEN đã hết
          #     hạn (rủi ro B13). Khi đó mọi workflow agent viết vào
          #     ops/workflows/ sẽ IM LẶNG không có hiệu lực — không có gì
          #     đỏ, chỉ là không có gì xảy ra. Đây là lý do nó được canh riêng.
          # Z9: đây là MỘT trong tám dấu hiệu của watchdog, không phải việc
          # chính. `gh run list` lỗi vặt (API, quyền, hay workflow chưa từng
          # chạy) không được phép làm đỏ cả job và nuốt luôn bảy dấu hiệu
          # còn lại — nhánh `if [ -n "$SYNC" ]` dưới coi rỗng là "không có gì
          # để báo", không phải "đã kiểm và ổn".
          SYNC=$(gh run list --repo "$REPO" --workflow sync-workflows.yml \
            --limit 1 --json conclusion,createdAt,url \
            --jq '.[0] | select(.) | "\(.conclusion)\t\(.url)"' || true)
          if [ -n "$SYNC" ]; then
            CONCL=$(echo "$SYNC" | cut -f1)
            URL=$(echo "$SYNC" | cut -f2)
            case "$CONCL" in
              success|"") ;;
              *) add "Lần chạy gần nhất của \`sync-workflows\` kết thúc \`$CONCL\`: $URL — kiểm tra hạn của PAT \`WORKFLOW_SYNC_TOKEN\` trước tiên. Trong lúc nó hỏng, mọi workflow mới trong \`ops/workflows/\` KHÔNG có hiệu lực.";;
            esac
          fi

          # 4 · Chi phí tích luỹ vượt 80% ngân sách học (CHARTER mục 8; D-C06
          #     xếp đây là một trong bốn cảnh báo khẩn của CHARTER 2.4).
          #     Lấy CẬN DƯỚI của ngân sách (600 USD trong khoảng 600–900) —
          #     cảnh báo sớm một nhịp rẻ hơn cảnh báo muộn một nhịp.
          #     Nguồn số liệu là bất biến I8: mỗi lần chạy một dòng `costUsd`.
          #     `find` chứ không phải `cat ops/logs/*.jsonl`: từ `D-C04` log
          #     nằm ở `ops/logs/<lane>/<id>.jsonl`, nên glob một tầng không
          #     khớp file nào và tổng chi phí ra 0 mà không gì đỏ (nhóm Z).
          BUDGET=600
          SPENT=$(find ops/logs -name '*.jsonl' -exec cat {} + 2>/dev/null | jq -s 'map(.costUsd // 0) | add // 0' || echo 0)
          PCT=$(awk -v s="$SPENT" -v b="$BUDGET" 'BEGIN { printf "%d", (s * 100) / b }')
          echo "Chi phí tích luỹ: $SPENT USD / $BUDGET USD = $PCT%."
          if [ "$PCT" -ge 80 ]; then
            add "Chi phí tích luỹ **$SPENT USD**, tức $PCT% ngân sách học ($BUDGET USD, CHARTER mục 8). Điều tiết ở cửa vào: không mở mục hay tập mới (CHARTER 2.2)."
          fi

          # 5 · Một routine có lượt chạy lỗi, hoặc không chạy quá 3 giờ
          #     (chỉ dẫn 4 của chủ dự án trên issue bản tin #17, mục P-020).
          #     Watchdog ở NGOÀI Claude nên không đọc được trực tiếp "routine
          #     nào vừa chạy, có lỗi hay không" — cách quan sát được duy nhất
          #     từ bên ngoài là NHỊP TIM: bước 0 của phụ lục P1/P3 ghi một
          #     dòng log ở MỌI lượt crux-worker-<N> và MỌI lượt
          #     crux-integrator, kể cả lượt không có PR nào xung đột (P3
          #     bước 0d) — nên dòng `at` mới nhất trong các dòng bước 0 là
          #     nhịp tim chung của cả hai loại routine.
          #     Một lượt lỗi SAU khi ghi xong bước 0 vẫn để lại nhịp tim —
          #     cách này bắt được "im hẳn", không bắt được "lỗi giữa chừng
          #     nhưng vẫn kịp ghi log", đây là giới hạn đã biết, không phải
          #     điều đã bỏ sót. `crux-digest` không ghi dòng bước 0 (không
          #     chạm code), nhưng digest đã có dấu hiệu số 1 canh riêng.
          #
          #     KHÔNG neo vào một tên file (mục P-023, bài kiểm
          #     `ops/test/step0-log-path.test.ts`): từ P-023 mỗi LƯỢT CHẠY
          #     ghi một file riêng, tên do `step0LogPath()` của kernel sinh,
          #     nên một đường dẫn cố định là cách dấu hiệu này hỏng im lặng
          #     ngay lượt đầu tiên tên file đổi (nhóm Z). Thay vào đó quét
          #     CẢ một thư mục rồi lọc theo trường `ref`.
          #
          #     ⚠️ **HAI NGUỒN, mục `P-043`.** Trước mục đó, nguồn duy nhất là
          #     `ops/logs` của bản đã checkout, tức bản trên `main` — nên nhịp
          #     tim chỉ đập khi một PR vào `main`, và trong một khoảng yên
          #     người canh gọi chủ dự án vì một nhà máy đang chạy đúng. Chủ dự
          #     án chốt trên `🤖 [QĐ] #213` (2026-09-24T06:10:33Z): chuyển
          #     nguồn nhịp tim ra khỏi `main` TRƯỚC khi bỏ PR log của bước 0,
          #     và **không có khoảng thời gian nào watchdog mất tín hiệu**.
          #
          #     "Không có khoảng nào" là lý do đây là phép `max` trên HAI
          #     nguồn chứ không phải một phép THAY nguồn: nguồn mới
          #     (`claude/telemetry`) còn rỗng cho tới lượt routine đầu tiên
          #     ghi vào nó, và bỏ `main` ra trong khoảng đó là tắt đúng dấu
          #     hiệu này mà không gì đỏ.
          #
          #     Bộ lọc `ref` nay chỉ còn MỘT bản, trong TypeScript
          #     (`isStep0Ref` của `ops/scripts/lane-heartbeat.ts`, gọi qua
          #     `ops/scripts/heartbeat-source.ts`). Bản `jq` chép tay ở đây
          #     đã lệch thật một lần — thiếu hai hình dạng `P1-step0-` và
          #     `P3-daily-` — nên nó bị bỏ hẳn thay vì được canh bằng một bài
          #     so chuỗi.
          TELEMETRY_CHECKOUT="${RUNNER_TEMP:-/tmp}/crux-telemetry"
          rm -rf "$TELEMETRY_CHECKOUT"
          # Z9 · `|| true` có chủ ý: nhánh telemetry có thể CHƯA tồn tại (mọi
          # lượt trước lượt routine đầu tiên ghi vào nó), và một fetch trượt
          # không được phép giết bảy dấu hiệu còn lại. Nguồn thiếu KHÔNG bị
          # nuốt: thư mục vắng mặt đi vào trường `missing` của
          # `heartbeat-source.ts` và được in ra trong báo cáo dưới.
          # P-059 · KHÔNG `--depth=1` nữa, và đây là một THAY ĐỔI CHI PHÍ có
          # chủ đích. Dấu hiệu số 8 dưới đây cần LỊCH SỬ nhánh, không chỉ đầu
          # nhánh: `ever` chỉ dựng được bằng cách đọc cây `heartbeat/` của MỌI
          # commit. Đo thật trên một kho trắng chạy đúng lệnh cũ:
          #
          #   git fetch --no-tags --depth=1 …
          #   git rev-list --count refs/crux/telemetry  → 1    (thật: 70)
          #   ever = tip = 18  ⇒  phép đo trả "0 thiếu"  (thật: 33)
          #
          # Đó là ca BÁO YÊN mà `KF-041` cấm — tệ hơn im lặng. Bảng cân nhắc
          # bốn lựa chọn (gồm `--depth=N` đủ lớn, và chuyển sang một nơi chạy
          # thưa hơn) nằm ở đầu `ops/scripts/telemetry-gaps.ts`.
          #
          # Chi phí khai thẳng: nhánh mọc ~1 commit mỗi 20 phút (70 commit sau
          # hai ngày), mỗi commit một blob nhỏ cộng hai tree, và lượt này chạy
          # mỗi giờ. Lối thoát đã cài sẵn: một lượt sau đặt lại trần độ sâu thì
          # `historyCommits` cộng ca 2 của `telemetryTipGaps` biến việc đó thành
          # một câu trong `problems`, KHÔNG thành "0 thiếu" — nên chi phí giảm
          # được mà không mua lại chỗ hỏng. `ops/test/telemetry-gaps.test.ts`
          # canh chính dòng này.
          git fetch --no-tags origin "+refs/heads/$TELEMETRY_BRANCH:refs/crux/telemetry" || true
          if git rev-parse --verify --quiet refs/crux/telemetry >/dev/null; then
            mkdir -p "$TELEMETRY_CHECKOUT"
            # Z9 · nuốt lỗi CÓ CHỦ Ý, và đây là chỗ vòng soát ngữ cảnh sạch của
            # PR #229 đo được là CHẶN ở bản đầu: không có lưới thì một lỗi của
            # `git archive` hay `tar` (archive lỗi, hết chỗ đĩa, SIGPIPE) giết cả
            # bước dưới `set -euo pipefail` — đo được EXIT=2, **không dấu hiệu
            # nào trong tám dấu hiệu chạy**. Và `smoke-workflows.yml` đã khai sẵn
            # rằng không gì canh một lần chạy đỏ của `watchdog.yml`, nên đó là
            # người canh chết mà không ai canh người canh (rủi ro B7).
            #
            # `rm -rf` chứ không chỉ `|| true`: một archive giải DỞ để lại thư
            # mục có thật nhưng thiếu file, và `heartbeat-source.ts` sẽ đọc nó
            # thành "đã đo, và nguồn rỗng" — tức xoá đúng chỗ phân biệt ba trạng
            # thái mà mục này dựng lên. Xoá thư mục đưa nó về `missing`, là
            # "chưa biết", đúng sự thật.
            git archive refs/crux/telemetry | tar -x -C "$TELEMETRY_CHECKOUT" || rm -rf "$TELEMETRY_CHECKOUT"
          fi

          # Z9 · `|| true`: `node` thiếu bản đủ mới (bước `setup-node` ở trên
          # cũng `continue-on-error`) phải thành "không đọc được nhịp tim" —
          # tức nhánh `-z "$LAST_BEAT"` GỌI `add` — chứ không thành một job đỏ
          # nuốt bảy dấu hiệu kia.
          BEAT=$(node ops/scripts/heartbeat-source.ts --json \
            --source "main=ops/logs" \
            --source "telemetry=$TELEMETRY_CHECKOUT/heartbeat" || true)
          # Báo cáo theo TỪNG nguồn đi vào log của lượt chạy và vào thân cảnh
          # báo, cùng cách dấu hiệu số 6 làm: một nguồn chết trong lúc nguồn
          # kia còn thở là đúng ca mà phép `max` che đi, nên nó phải nhìn thấy
          # được. Nó KHÔNG tự gọi `add` — chừng nào `main` còn là một nguồn thì
          # một nguồn chết không làm người canh mù, và gọi chủ dự án cho một
          # chuyện máy tự lo là ngược thước đo CHARTER 1.3.
          #
          # Lấy `.render` từ chính script, KHÔNG dựng lại bằng `jq`: vòng soát
          # ngữ cảnh sạch của PR #229 đo được rằng bản `jq` tự render ba trạng
          # thái là một bản chép thứ hai không bài kiểm nào so — bỏ nhánh
          # `.missing` khỏi nó thì 35/35 vẫn xanh.
          #
          # `$BEAT` rỗng (node hỏng ở dòng trên) được kiểm TƯỜNG MINH, không
          # dựa vào mã thoát của `jq`: `echo "" | jq -r '.at // empty'` thoát
          # **0**, nên một `|| echo …` ở đây là mã chết — cũng do vòng soát đó
          # đo ra.
          if [ -z "$BEAT" ]; then
            BEAT_REPORT="⚠ Không đọc được nhịp tim từ nguồn nào (P-043): \`heartbeat-source.ts\` không trả về gì. Xem log của lượt chạy này."
            LAST_BEAT=""
          else
            # Z9 · `|| true` ở hai dòng dưới: JSON lạ làm `jq` thoát khác 0, và
            # dưới `set -euo pipefail` thì cả job đỏ — nuốt bảy dấu hiệu kia.
            # Rơi về chuỗi rỗng là hướng an toàn: nhánh `-z "$LAST_BEAT"` dưới
            # GỌI `add`, nên "không đọc được" vẫn tới tay chủ dự án.
            BEAT_REPORT=$(echo "$BEAT" | jq -r '.render // empty' 2>/dev/null || true)
            # Z9 · cùng lý do dòng ngay trên: `jq` thoát khác 0 không được phép
            # giết cả job; rỗng đi vào nhánh `-z "$LAST_BEAT"`, nhánh đó GỌI `add`.
            LAST_BEAT=$(echo "$BEAT" | jq -r '.at // empty' 2>/dev/null || true)
            if [ -z "$BEAT_REPORT" ]; then
              BEAT_REPORT="⚠ Không đọc được báo cáo nguồn nhịp tim (P-043) — \`heartbeat-source.ts\` trả về JSON không có \`render\`."
            fi
          fi
          echo "$BEAT_REPORT"

          if [ -z "$LAST_BEAT" ]; then
            add "Không đọc được dòng bước 0 nào từ **nguồn nào** (\`ops/logs\` trên \`main\`, và nhánh \`$TELEMETRY_BRANCH\`) — không tính được nhịp tim của routine worker/integrator (dấu hiệu số 5, mục P-020). Hoặc chưa lượt nào ghi, hoặc hình dạng \`ref\` đã đổi."
          else
            AGE_MIN=$(( (NOW - $(date -u -d "$LAST_BEAT" +%s)) / 60 ))
            [ "$AGE_MIN" -gt 180 ] && add "Không routine \`crux-worker-*\`/\`crux-integrator\` nào ghi nhịp tim trong $AGE_MIN phút (ngưỡng 180 = 3 giờ, nhịp tim là dòng \`at\` mới nhất trong các dòng bước 0, lấy \`max\` trên \`ops/logs\` của \`main\` và nhánh \`$TELEMETRY_BRANCH\`). Có thể một routine đã lỗi hoặc đã dừng chạy."
          fi

          # 6 · Nhịp tim THEO TỪNG LÀN (Z7, mục `P-014` sóng 3).
          #     Dấu hiệu số 5 ở trên lấy `max` trên MỌI dòng bước 0, nên nó
          #     trả lời đúng câu "routine còn chạy không" và sai câu "làn nào
          #     đang đứng im": bước 0 ghi một dòng ở MỌI lượt worker (phụ lục
          #     P3 bước 0d), nên chừng nào còn một worker thở thì `max` còn
          #     mới, bất kể chín làn kia đã im mấy ngày. Đo được lúc thêm dấu
          #     hiệu này: làn `integration` có nhịp tim 2,2 giờ khi TÍNH cả
          #     dòng bước 0 và 23,4 giờ khi TRỪ chúng ra.
          #
          #     ⚠️ Dấu hiệu này KHÔNG tự mở/bình luận issue — nó chỉ in ra log
          #     của lượt chạy và nối vào thân cảnh báo khi đã có dấu hiệu khác
          #     nổ. Lý do khai thẳng, không giấu: một làn im là chỗ nghẽn của
          #     MÁY, không phải việc chủ dự án bấm được (CHARTER 1.3), và
          #     workflow này bình luận LẠI mỗi giờ chừng nào dấu hiệu còn —
          #     một dấu hiệu kéo dài nhiều ngày sẽ thành nhiều chục lần @nhắc.
          #     Nhịp cảnh báo là phạm vi của mục `P-034`. Đường phát hiện
          #     độc lập của Z7 đi qua bản tin ngày (phụ lục P2 gọi
          #     `pnpm lanes:heartbeat`), tốn 0 lần thao tác thêm của chủ dự án.
          #
          #     Dùng `if !` chứ KHÔNG dùng `|| LANE_REPORT=…`: script thoát
          #     khác 0 khi không quét được `ops/logs`, và bắt lỗi đó là có
          #     chủ đích (đây là MỘT trong tám dấu hiệu, không được phép giết
          #     bảy dấu hiệu kia). Nhưng `|| VAR=…` là một hình dạng nuốt lỗi
          #     mà luật Z9 (`undocumentedSwallows`) KHÔNG nhìn thấy — nó chỉ
          #     bắt `|| true` và `continue-on-error`. Đưa một hình dạng vô
          #     hình vào cây là tự mở một chỗ nhóm Z mới, nên viết tường minh.
          if ! LANE_REPORT=$(node ops/scripts/lane-heartbeat.ts); then
            LANE_REPORT="⚠ Không đo được nhịp tim theo làn (Z7) — xem log của lượt chạy này."
          fi
          echo "$LANE_REPORT"

          # 7 · Nhánh chờ `step0-pending` chưa ai gộp (`KF-041`, mục
          #     `platform/P-056`). Một lượt bước 0 không gỡ được PR nào được
          #     quyền KHÔNG mở PR (`P-038`); dòng log của nó vẫn được ghi và
          #     đẩy lên nhánh chờ, rồi một lượt SAU phải `cherry-pick` nhánh
          #     đó vào PR của mình. Vế hai đó không có gì nhắc, và nó đã hỏng
          #     BỐN lần liên tiếp — bốn lượt worker không có dòng log nào
          #     trên nhánh chính, nhánh cũ nhất kẹt ~34,9 giờ, mà `pnpm
          #     check` xanh, CI xanh, `main` xanh, dấu hiệu số 5 vẫn đập
          #     (bản sao nhịp tim ở `claude/telemetry` che đúng chỗ này).
          #
          #     Đây là chỗ RẺ NHẤT để canh: lượt này đã `git fetch` nhánh
          #     telemetry ở trên, nên thêm một `git ls-remote --heads` không
          #     thêm job nào. `pnpm check` KHÔNG phải chỗ đặt — nó chạy trên
          #     mọi PR và không có remote trong CI nếu không thêm một lần
          #     fetch cho mỗi lượt chạy.
          #
          #     NGƯỠNG GIỜ KHÔNG NẰM Ở ĐÂY: nó là `STEP0_PENDING_STALE_HOURS`
          #     của `ops/scripts/step0-pending-branches.ts`, suy từ
          #     `DEFAULT_DELAY_HOURS`. YAML chỉ so SỐ NHÁNH quá ngưỡng với 0.
          #     Chép con số giờ vào đây là tạo bản luật thứ hai, và hai bản
          #     lệch nhau im lặng — `ops/test/step0-pending-branches.test.ts`
          #     canh đúng chiều đó.
          PENDING_LIST="${RUNNER_TEMP:-/tmp}/crux-step0-pending.txt"
          PENDING_PROBLEMS=0

          # KHÔNG `|| true` ở đây, và chỗ này là một chỗ hỏng đã đo được
          # trong chính vòng soát của mục `P-056` — ghi lại vì nó đúng nhóm
          # Z mà dấu hiệu này sinh ra để giết.
          #
          # Bản đầu viết `git ls-remote … | sed … > "$PENDING_LIST" || true`.
          # Dưới `set -euo pipefail`, `git` hỏng làm cả pipeline thoát khác
          # 0, `|| true` nuốt, và `$PENDING_LIST` còn lại RỖNG. Script dưới
          # đọc một danh sách rỗng rồi in ra ĐÚNG TỪNG BYTE câu của ca lành:
          # "không nhánh nào còn dòng log chưa vào nhánh chính". Tức một lần
          # `ls-remote` trượt không im lặng — nó KHẲNG ĐỊNH LÀ LÀNH, và cái
          # đó tệ hơn im lặng.
          #
          # Nên bắt mã thoát tường minh, đúng hình dạng `if !` mà dấu hiệu
          # số 6 dùng, và rơi về một câu "không đo được" phân biệt được với
          # ca lành. Danh sách rỗng THẬT (chưa lượt log-only nào chạy) vẫn
          # đi đường thường: `git ls-remote` thoát 0 với đầu ra rỗng.
          if ! git ls-remote --heads origin "refs/heads/$STEP0_PENDING_PREFIX/*" \
              | sed 's#.*refs/heads/##' > "$PENDING_LIST"; then
            PENDING_REPORT="⚠ Không đo được nhánh chờ \`step0-pending\` (KF-041) — \`git ls-remote\` thoát khác 0. ĐÂY KHÔNG PHẢI \"không có nhánh nào kẹt\"; xem log của lượt chạy này."
            PENDING_STALE=0
            PENDING_PROBLEMS=1
          # `if !` chứ KHÔNG `|| VAR=…`, cùng lý do đã ghi ở dấu hiệu số 6:
          # `|| VAR=…` là một hình dạng nuốt lỗi mà luật Z9 không nhìn thấy.
          elif ! PENDING_JSON=$(node ops/scripts/step0-pending-branches.ts \
              --branches "$PENDING_LIST" --json); then
            PENDING_REPORT="⚠ Không đo được nhánh chờ \`step0-pending\` (KF-041) — script thoát khác 0. Xem log của lượt chạy này."
            PENDING_STALE=0
            PENDING_PROBLEMS=1
          else
            # Z9 · `|| true` có chủ ý, cùng lý do và cùng hình dạng như dấu
            # hiệu số 5: một JSON lạ làm `jq` thoát khác 0, và dưới
            # `set -euo pipefail` thì cả job đỏ — tức nuốt bảy dấu hiệu kia.
            # Rơi về chuỗi rỗng là hướng an toàn: nhánh `-z` ngay dưới biến
            # nó thành một câu "không đo được", không thành một câu báo yên.
            PENDING_REPORT=$(echo "$PENDING_JSON" | jq -r '.render // empty' 2>/dev/null || true)
            # Z9 · rỗng ở đây KHÔNG trôi tiếp: nhánh `-z` ngay dưới biến nó
            # thành một câu "không đo được", không thành một câu báo yên.
            PENDING_STALE=$(echo "$PENDING_JSON" | jq -r '.stale | length' 2>/dev/null || true)
            # Z9 · cùng lý do dòng trên — rỗng đi vào nhánh `-z`, không đi
            # vào phép so `-gt 0` (một chuỗi rỗng ở đó giết cả job).
            PENDING_PROBLEMS=$(echo "$PENDING_JSON" | jq -r '.problems | length' 2>/dev/null || true)
            if [ -z "$PENDING_REPORT" ] || [ -z "$PENDING_STALE" ] || [ -z "$PENDING_PROBLEMS" ]; then
              PENDING_REPORT="⚠ Không đọc được báo cáo nhánh chờ (KF-041) — JSON không có \`render\`/\`stale\`/\`problems\`. ĐÂY KHÔNG PHẢI \"không có nhánh nào kẹt\"."
              PENDING_STALE=0
              PENDING_PROBLEMS=1
            fi
          fi
          echo "$PENDING_REPORT"

          # `problems` cũng phải tới được chỗ có người đọc, không chỉ nằm
          # trong log lượt chạy: một nhánh chờ mang mã log không đọc được
          # vẫn có thể đang giữ một dòng log chưa gộp, và im lặng ở đó đúng
          # là chỗ hỏng `KF-041` ghi lại.
          if [ "$PENDING_PROBLEMS" -gt 0 ] && [ "$PENDING_STALE" -eq 0 ]; then
            add "Dấu hiệu số 7 (nhánh chờ \`step0-pending\`, \`KF-041\`) có $PENDING_PROBLEMS chỗ KHÔNG ĐO ĐƯỢC. Đây không phải \"không có nhánh nào kẹt\" — bất biến **I8** có thể đang thủng mà phép đo không thấy. Chi tiết từng chỗ ở ngay dưới."
          fi

          if [ "$PENDING_STALE" -gt 0 ]; then
            add "Có $PENDING_STALE nhánh chờ \`$STEP0_PENDING_PREFIX/*\` mang dòng log bước 0 CHƯA vào nhánh chính quá ngưỡng (\`KF-041\`, mục \`platform/P-056\`; ngưỡng ở \`STEP0_PENDING_STALE_HOURS\`). Bất biến **I8** đang thủng đúng ngần ấy lượt chạy: mọi bên đọc log — \`ops/metrics.md\`, bản tin ngày, phép đếm chuỗi kẹt của phụ lục P1 bước 2 — đếm THẤP hơn sự thật. Cách gỡ: lượt worker kế tiếp \`cherry-pick\` các nhánh ấy vào PR của nó rồi xoá nhánh đã gộp (\`P-038\`). Chi tiết từng nhánh ở ngay dưới."
          fi

          #  8. Mục `platform/P-059`, `KF-043` VẾ ĐO LẠI · đầu nhánh
          #     `$TELEMETRY_BRANCH` KHÔNG còn giữ đủ mọi bản ghi nhịp tim mà
          #     nhánh đã từng giữ.
          #
          #     Nhánh này append-only — mỗi lượt một file, tên sinh từ
          #     `step0LogPath` của kernel — nên một bản ghi biến mất khỏi đầu
          #     nhánh nghĩa là một lần đẩy đã XOÁ. Không có ca lành, nên
          #     NGƯỠNG LÀ 0; lý lẽ đầy đủ ở đầu `ops/scripts/telemetry-gaps.ts`.
          #     Đo được lúc mở mục: đầu nhánh 12 file, lịch sử 45, thiếu 33 —
          #     và `pnpm check` xanh, CI xanh, nhánh chính xanh, dấu hiệu số 5
          #     VẪN ĐÚNG suốt thời gian đó, vì nó lấy `max` của `at` nên một
          #     file cũng đủ làm nó xanh. Nhóm **Z** thuần.
          #
          #     Lượt này đã fetch nhánh telemetry với LỊCH SỬ ĐẦY ĐỦ ở trên
          #     (xem khối P-059 ở đó), nên dấu hiệu này không thêm một lần
          #     fetch nào. `pnpm check` KHÔNG phải chỗ đặt: nó chạy trên mọi
          #     PR và không có remote trong CI.
          #
          #     NGƯỠNG KHÔNG CHÉP VÀO ĐÂY, cùng luật dấu hiệu số 7: YAML chỉ
          #     so SỐ BẢN GHI THIẾU với 0. Không hằng số giờ nào — có một là
          #     mở một cửa sổ cho phép xoá.
          GAPS_MISSING=0
          GAPS_PROBLEMS=0
          GAPS_TMP="${RUNNER_TEMP:-/tmp}/crux-telemetry-gaps"
          rm -rf "$GAPS_TMP"
          mkdir -p "$GAPS_TMP"

          # Ba đầu vào của phép đo, mỗi cái một file — cùng hình dạng
          # `$PENDING_LIST` của dấu hiệu số 7, và cùng lý do: mã thoát của TỪNG
          # lệnh `git` kiểm được tường minh, không trôi vào một pipeline dài mà
          # `|| true` nuốt. Mọi nhánh "không đo được" dưới đây rơi về một câu
          # PHÂN BIỆT ĐƯỢC với ca lành, không rơi về một danh sách rỗng.
          #
          # `refs/crux/telemetry` có thể không tồn tại vì HAI lý do rất khác
          # nhau, và vòng soát bước 6 bắt đúng chỗ bản đầu trộn chúng:
          #
          #  - nhánh CHƯA sinh trên remote — ca thường, lành, im đúng ở đây;
          #  - lần fetch ở trên TRƯỢT (nó có `|| true` đúng chủ đích) trong khi
          #    nhánh CÓ trên remote — ca "không đo được", phải GỌI `add`.
          #
          # `git ls-remote --exit-code --heads` phân biệt hai ca đó, cùng cách
          # dấu hiệu số 7 đã dùng. Lời biện "dấu hiệu số 5 đã nói nguồn vắng
          # mặt" KHÔNG đủ: `$BEAT_REPORT` chỉ tới thân issue khi một dấu hiệu
          # KHÁC đã bật.
          if ! git rev-parse --verify --quiet refs/crux/telemetry >/dev/null; then
            if git ls-remote --exit-code --heads origin "refs/heads/$TELEMETRY_BRANCH" >/dev/null 2>&1; then
              GAPS_REPORT="⚠ Không đo được bản ghi nhịp tim thiếu (\`KF-043\`, mục \`platform/P-059\`) — nhánh \`$TELEMETRY_BRANCH\` CÓ trên remote mà lượt này không nạp được nó về. ĐÂY KHÔNG PHẢI \"đầu nhánh giữ đủ\"; xem log của lượt chạy này."
              GAPS_PROBLEMS=1
            else
              GAPS_REPORT="Nhịp tim \`$TELEMETRY_BRANCH\`: nhánh chưa sinh trên remote, chưa có gì để đo (dấu hiệu số 8, mục \`platform/P-059\`)."
            fi
          elif ! git rev-list refs/crux/telemetry > "$GAPS_TMP/commits.txt"; then
            GAPS_REPORT="⚠ Không đo được bản ghi nhịp tim thiếu (\`KF-043\`, mục \`platform/P-059\`) — \`git rev-list\` thoát khác 0. ĐÂY KHÔNG PHẢI \"đầu nhánh giữ đủ\"; xem log của lượt chạy này."
            GAPS_PROBLEMS=1
          elif ! git ls-tree --name-only refs/crux/telemetry:heartbeat > "$GAPS_TMP/tip.txt"; then
            GAPS_REPORT="⚠ Không đo được bản ghi nhịp tim thiếu (\`KF-043\`) — \`git ls-tree\` trên đầu nhánh thoát khác 0. ĐÂY KHÔNG PHẢI \"đầu nhánh giữ đủ\"; xem log của lượt chạy này."
            GAPS_PROBLEMS=1
          else
            # `ls-tree` trên một commit CHƯA có `heartbeat/` thoát khác 0, và ca
            # đó là ca thường (commit gốc của nhánh). `git cat-file -e` tách nó
            # ra khỏi một lần trượt THẬT, nên `|| true` ở đây không còn nuốt một
            # lỗi làm `ever` nhỏ đi — tức làm số bản ghi thiếu nhỏ đi.
            while read -r C; do
              if git cat-file -e "$C:heartbeat" 2>/dev/null; then
                git ls-tree --name-only "$C:heartbeat"
              fi
            done < "$GAPS_TMP/commits.txt" | sort -u > "$GAPS_TMP/ever.txt"

            GAPS_COMMITS=$(wc -l < "$GAPS_TMP/commits.txt" | tr -d ' ')

            # LỊCH SỬ CỦA REF NÀY có bị cắt không — phép đo HẸP theo ref, không
            # phải cờ nông của cả kho. Đo được (vòng soát bước 6 làm rõ chỗ
            # này): `actions/checkout@v7` mặc định `fetch-depth: 1` nên
            # `git rev-parse --is-shallow-repository` trả `true` ở MỌI lượt, trong
            # khi lần fetch không `--depth` ở trên lấy ĐẦY ĐỦ 74 commit của nhánh
            # — nhánh telemetry có gốc riêng, không chung lịch sử với `main`, nên
            # biên nông của `main` không cắt được nó. Dùng cờ kho ở đây sẽ báo
            # "không đo được" mỗi giờ cho một nhánh đang lành, tức @nhắc chủ dự
            # án mỗi 4 giờ cho một chuyện không có (ngược thước đo CHARTER 1.3).
            #
            # Phép đúng: GIAO của `git rev-list <ref>` với danh sách biên nông.
            # Đo thật: fetch không `--depth` → giao RỖNG; `--depth=5` → giao CÓ.
            # Nhờ vậy lưới này đúng với MỌI trần độ sâu, không chỉ `--depth=1`.
            GAPS_SHALLOW_FILE=$(git rev-parse --git-path shallow)
            GAPS_TRUNCATED=false
            if [ -s "$GAPS_SHALLOW_FILE" ] \
                && grep -qxF -f "$GAPS_SHALLOW_FILE" "$GAPS_TMP/commits.txt"; then
              GAPS_TRUNCATED=true
            fi

            # `set +e` TƯỜNG MINH, không `|| VAR=…`: script thoát **1** khi CÓ
            # bản ghi thiếu — một phán quyết bình thường, không phải lỗi — và
            # thoát **2** khi KHÔNG ĐO ĐƯỢC. Hai ca đó phải đi hai đường, nên
            # mã thoát phải đọc được thay vì bị `set -e` biến thành job đỏ.
            set +e
            GAPS_JSON=$(node ops/scripts/telemetry-gaps.ts --json \
              --tip "$GAPS_TMP/tip.txt" \
              --ever "$GAPS_TMP/ever.txt" \
              --history-commits "$GAPS_COMMITS" \
              --history-truncated "$GAPS_TRUNCATED")
            GAPS_STATUS=$?
            set -e

            if [ "$GAPS_STATUS" -ge 2 ] || [ -z "$GAPS_JSON" ]; then
              GAPS_REPORT="⚠ Không đo được bản ghi nhịp tim thiếu (\`KF-043\`, mục \`platform/P-059\`) — script thoát $GAPS_STATUS. ĐÂY KHÔNG PHẢI \"đầu nhánh giữ đủ\"; xem log của lượt chạy này."
              GAPS_PROBLEMS=1
            else
              # Z9 · `|| true` có chủ ý, cùng hình dạng dấu hiệu số 5 và số 7:
              # một JSON lạ làm `jq` thoát khác 0, và dưới `set -euo pipefail`
              # thì cả job đỏ — tức nuốt bảy dấu hiệu kia. Rỗng đi vào nhánh
              # `-z` ngay dưới và thành một câu "không đo được", KHÔNG thành một
              # câu báo yên. `// empty` chứ KHÔNG để `null|length` ra 0: một JSON
              # thiếu `gaps` phải thành "không đo được", không thành "0 thiếu".
              GAPS_REPORT=$(echo "$GAPS_JSON" | jq -r '.render // empty' 2>/dev/null || true)
              # Z9 · cùng lý do khối ngay trên: rỗng đi vào nhánh `-z` dưới.
              GAPS_MISSING=$(echo "$GAPS_JSON" | jq -r 'if has("gaps") then (.gaps | length) else empty end' 2>/dev/null || true)
              # Z9 · cùng lý do — rỗng đi vào nhánh `-z`, không vào phép so `-gt`.
              GAPS_PROBLEMS=$(echo "$GAPS_JSON" | jq -r 'if has("problems") then (.problems | length) else empty end' 2>/dev/null || true)
              if [ -z "$GAPS_REPORT" ] || [ -z "$GAPS_MISSING" ] || [ -z "$GAPS_PROBLEMS" ]; then
                GAPS_REPORT="⚠ Không đọc được báo cáo bản ghi nhịp tim thiếu (\`KF-043\`) — JSON không có \`render\`/\`gaps\`/\`problems\`. ĐÂY KHÔNG PHẢI \"đầu nhánh giữ đủ\"."
                GAPS_MISSING=0
                GAPS_PROBLEMS=1
              fi
            fi
          fi
          echo "$GAPS_REPORT"

          # `problems` phải tới được chỗ có người đọc, không chỉ nằm trong log
          # lượt chạy — cùng lý do dấu hiệu số 7 làm vậy.
          if [ "$GAPS_PROBLEMS" -gt 0 ] && [ "$GAPS_MISSING" -eq 0 ]; then
            add "Dấu hiệu số 8 (bản ghi nhịp tim thiếu ở đầu nhánh \`$TELEMETRY_BRANCH\`, \`KF-043\`) có $GAPS_PROBLEMS chỗ KHÔNG ĐO ĐƯỢC. Đây không phải \"đầu nhánh giữ đủ\" — một lần đẩy có thể đang xoá bản ghi mà phép đo không thấy. Chi tiết từng chỗ ở ngay dưới."
          fi

          if [ "$GAPS_MISSING" -gt 0 ]; then
            add "Đầu nhánh \`$TELEMETRY_BRANCH\` THIẾU $GAPS_MISSING bản ghi nhịp tim mà nhánh đã từng giữ (\`KF-043\`, mục \`platform/P-059\`). Nhánh này append-only nên NGƯỠNG LÀ 0 — không có ca lành, mỗi bản ghi thiếu là một lần đẩy đã xoá. Dấu hiệu số 5 vẫn xanh vì nó lấy \`max\` của \`at\`, nên một file cũng đủ. Cách gỡ, MỘT lệnh, máy tự làm được: \`pnpm telemetry:restore\`. Chi tiết từng bản ghi ở ngay dưới."
          fi

          if [ "$TEST" = "true" ]; then
            add "Đây là cảnh báo THỬ, do chủ dự án bấm tay. Nếu anh đọc được dòng này trên điện thoại thì đường thông báo đã thông (DoD Đợt 0)."
          fi

          if [ -z "$PROBLEMS" ]; then
            echo "Nhà máy vẫn thở. Không mở issue."
            exit 0
          fi

          TITLE="[CẢNH BÁO] Nhà máy im lặng"
          EXISTING=$(gh issue list --repo "$REPO" --label alert --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          # P-034 · thân cập nhật KHÔNG @nhắc và KHÔNG mang mốc.
          #
          # Trước mục này, mọi comment của workflow đều mở đầu bằng `@$OWNER`,
          # và workflow chạy MỖI GIỜ: một dấu hiệu kéo dài một ngày là 24 lần
          # gọi chủ dự án, ngược thước đo CHARTER 1.3. Nay @nhắc tách hẳn ra
          # khối dưới và đi theo nhịp 4 giờ mà chủ dự án chốt kèm `#169`, còn
          # comment này chỉ còn việc kể dấu hiệu đang thấy.
          #
          # Mốc KHÔNG được lọt vào khối này: nó chạy mỗi giờ, nên mang mốc
          # vào đây sẽ đẩy "lần @nhắc gần nhất" về hiện tại ở mọi lượt và
          # nhịp 4 giờ không bao giờ tới hạn — @nhắc chết hẳn mà không gì đỏ.
          # `ops/test/alert-escalation-workflows.test.ts` canh đúng luật này.
          BODY=$(printf '%s\n' \
            "🤖 Người canh phát hiện:" \
            "" \
            "$PROBLEMS" \
            "$BEAT_REPORT" \
            "$LANE_REPORT" \
            "$PENDING_REPORT" \
            "$GAPS_REPORT" \
            "" \
            "Xem \`ops/lanes/priority.md\` để biết làn nào đang chờ." \
            "Routine \`crux-integrator\` đóng issue này khi các dấu hiệu hết.")

          # Vân tay của TẬP DẤU HIỆU — xem chú thích ở `MARKER_PREFIX`. Tập
          # đổi thì mốc đổi, và mốc đổi thì cảnh báo khẩn mới được gọi NGAY
          # thay vì phải chờ hết khoảng lặng 4 giờ của tập cũ.
          FINGERPRINT=$(printf '%s' "$PROBLEMS" | sha256sum | cut -c1-12)
          MARKER="${MARKER_PREFIX}${FINGERPRINT} -->"

          MENTION=$(printf '%s\n' \
            "$MARKER" \
            "🤖 @$OWNER người canh có việc cần anh xem — các dấu hiệu ở ngay trên." \
            "" \
            "Đây là một trong bốn cảnh báo khẩn của CHARTER 2.4. Nhắc lại mỗi 4 giờ chừng nào tập dấu hiệu này còn nguyên; một dấu hiệu MỚI xuất hiện thì gọi ngay, không chờ hết 4 giờ (mục \`platform/P-034\`).")

          # Chạy thử dừng ở ĐÂY, không sớm hơn: tám phép soát trên đã gọi
          # `gh issue list`, `gh pr list`, `gh run list` thật và đọc
          # `ops/logs/**` thật, nên lỗi quyền hay lệnh `gh` sai vẫn lộ ra.
          # Chỉ đúng thao tác ghi ra ngoài là bị chặn.
          if [ "$DRY_RUN" = "true" ]; then
            printf 'CHẠY THỬ — KHÔNG mở và KHÔNG bình luận issue nào.\nĐỊNH %s:\n%s\n%s\n%s\n' \
              "$([ -n "$EXISTING" ] && echo "bình luận vào issue #$EXISTING" || echo "mở issue mới \"$TITLE\" nhãn alert")" \
              "────────" "$BODY" \
              "$([ -n "$EXISTING" ] && echo "(@nhắc hay không do ops/scripts/alert-escalation.ts quyết, nhịp 4 giờ)" || echo "$MENTION")"
            exit 0
          fi

          if [ -z "$EXISTING" ]; then
            # Issue MỚI mang @nhắc ngay trong thân — vế 1 của câu trả lời
            # kèm `#169`. Mốc đi cùng để lượt sau biết đã nhắc lúc nào.
            gh issue create --repo "$REPO" --title "$TITLE" --label alert \
              --body "$(printf '%s\n\n%s\n' "$BODY" "$MENTION")"
            echo "Mở issue người canh, @nhắc NGAY trong thân issue (P-034)."
            exit 0
          fi

          gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"

          # Thân issue ĐỨNG ĐẦU danh sách: lần @nhắc đầu tiên nằm ở thân, bỏ
          # nó ra thì lượt nào cũng thấy "chưa nhắc lần nào" và gọi chủ dự án
          # mỗi giờ — đúng thứ mục P-034 vừa gỡ.
          #
          # I7 · CHỈ đọc thân và comment của `github-actions[bot]`, y như
          # `automerge.yml` làm với khối phạm vi sự cố. Không lọc thì bất kỳ
          # ai cũng đặt lại được đồng hồ 4 giờ chỉ bằng một comment mang
          # chuỗi mốc — và không cần ác ý: nút "Quote reply" của GitHub chép
          # nguyên markdown thô, HTML comment kể cả.
          #
          # Z9 · `|| DECISION=…`: `gh` lỗi vặt hay JSON lạ dưới `set -euo
          # pipefail` sẽ giết cả bước, mà comment tình trạng thì đã đăng rồi
          # — tức là @nhắc mất trong im lặng, đúng chữ ký hỏng mục này sinh
          # ra để chữa. Rơi về `mention`: gọi thừa một lần là phiền, một
          # cảnh báo khẩn câm là chỗ hỏng.
          if ! DECISION=$(gh issue view "$EXISTING" --repo "$REPO" --json author,body,createdAt,comments \
            --jq '[select(.author.login == "github-actions[bot]") | {body, createdAt}] + [.comments[] | select(.author.login == "github-actions[bot]") | {body, createdAt}]' \
            | node ops/scripts/alert-escalation.ts "$MARKER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"); then
            DECISION='{"verdict":"mention","lastMentionAt":null,"hoursSinceLastMention":null,"unreadableMarkerComments":0}'
            echo "Không đọc được lịch sử @nhắc (gh hoặc alert-escalation.ts lỗi) — rơi về mention."
          fi
          echo "Quyết định @nhắc: $DECISION"

          UNREADABLE=$(echo "$DECISION" | jq -r '.unreadableMarkerComments')
          if [ "$UNREADABLE" != "0" ]; then
            echo "$UNREADABLE mục mang mốc có createdAt không đọc được — số giờ ở trên là CẬN DƯỚI."
          fi

          if [ "$(echo "$DECISION" | jq -r '.verdict')" != "mention" ]; then
            echo "Lần @nhắc gần nhất chưa quá 4 giờ. Không nhắc lại."
            exit 0
          fi
          gh issue comment "$EXISTING" --repo "$REPO" --body "$MENTION"
