# 🤖 CI — cổng vào main (bất biến I1, I2, I3).
#
# File này được viết vào ops/workflows/. Workflow sync-workflows.yml (do chủ
# dự án tạo một lần) chép nó sang .github/workflows/ sau khi PR merge vào
# main. Agent không ghi .github/ (CHARTER 3.2, giả định G10).
#
# Tên các job dưới đây LÀ tên status check dùng để bật ruleset.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
# KF-004 pull_request: job `protected-area` gắn và gỡ nhãn bằng GITHUB_TOKEN,
# và chính workflow này đăng ký `on: pull_request` với `labeled`/`unlabeled`
# trong `types` (mục `P-009`) — hai đường đi KHÁC nhau cho cùng một hành
# động "thêm nhãn":
#
#   - Nhãn do CHÍNH job của workflow này gắn (`gh pr edit` bằng
#     `GITHUB_TOKEN`) KHÔNG kích hoạt lại CI — GitHub cố ý không tính sự
#     kiện do `GITHUB_TOKEN` sinh ra là một trigger mới, để tránh vòng lặp.
#     Không đứt gì: đó vẫn là điều mong muốn cho các nhãn `owner-merge` /
#     `automerge-delayed` / `cross-lane` mà job `protected-area` tự gắn.
#   - Nhãn do NGƯỜI (hoặc một phiên agent gọi API bằng danh tính riêng, không
#     phải `GITHUB_TOKEN` của chính run này) gắn/gỡ THÌ có kích hoạt lại CI.
#     Đây là đường P-009 cần: nhãn `fix` gắn MUỘN (sau khi PR đã mở, CI đã
#     chạy xong lượt đầu) giờ chạy lại toàn bộ CI, và job `fix-has-test` bên
#     dưới đọc lại nhãn hiện tại qua API — không tin ảnh chụp cũ.

  # pull-requests: write đủ cho CẢ hai việc của job protected-area: gắn nhãn
  # lên PR, VÀ tạo nhãn của repo bằng `gh label create`. Đã kiểm bằng chạy
  # thật — ci run #1 tạo được `automerge` và `cross-lane` mà không có quyền
  # `issues` nào. Vì vậy KHÔNG thêm `issues: write` vào đây. Xem KF-003.
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # contracts → lint:deps (I3) → typecheck → test → replay.
      # Kiểm ở chỗ rẻ nhất: thứ tự này cố ý, cái rẻ chạy trước.
      - run: pnpm check

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # BẤT BIẾN I1. KHÔNG dựa vào secret scanning của GitHub: với repo
      # private, tính năng đó cần gói trả phí riêng.
      #
      # Phiên bản gitleaks được giải ở lúc chạy rồi ĐỐI CHIẾU CHECKSUM do
      # chính bản phát hành công bố. Lý do không ghim cứng một số phiên bản:
      # phiên soạn workflow này không ra được mạng để xác nhận số đó có thật,
      # và một số phiên bản đoán mò sẽ làm CI đỏ im lặng ở lần chạy đầu.
      - name: Quét secret bằng gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name)
          V="${TAG#v}"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/${TAG}"
          curl -sSfL -o gitleaks.tar.gz "${BASE}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt  "${BASE}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt \
            | awk '{print $1"  gitleaks.tar.gz"}' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  fix-has-test:
    name: fix-has-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # KHÔNG khai `permissions:` riêng ở đây (bẫy KF-003/KF-008 đã sập một
    # lần khi soát chéo PR này): một khối `permissions:` cấp JOB thay thế
    # toàn bộ khối cấp WORKFLOW cho đúng job đó, không cộng thêm — quyền
    # không liệt kê thành `none`, kể cả `contents`, làm `actions/checkout`
    # hỏng với lỗi gây hiểu lầm "Repository not found" (404). Khối cấp
    # workflow phía trên đã có sẵn CẢ HAI quyền job này cần —
    # `contents: read` (cho checkout) và `pull-requests: write`, thoả luôn
    # `pull-requests: read` (cho `gh api repos/.../pulls/$PR`) — nên không
    # cần khai gì thêm ở đây.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # BẤT BIẾN I2, vế thứ hai: PR có nhãn `fix` phải kèm test tái hiện lỗi.
      # Sửa lỗi mà không có test là mời lỗi đó quay lại.
      #
      # Mục `P-009`: đọc nhãn hiện tại QUA API, không qua
      # `github.event.pull_request.labels` — ảnh chụp đó cố định tại lúc
      # workflow run BẮT ĐẦU, nên một PR mở trước rồi mới gắn `fix` sau (thứ
      # tự phổ biến nhất khi agent mở PR nháp trước) sẽ đọc thấy nhãn đã có
      # ở lần chạy MỚI (do `labeled` kích hoạt), nhưng đọc từ ảnh chụp cũ ở
      # một lần chạy cũ hơn vẫn đang treo vẫn sai — API luôn là hiện tại.
      - name: Đọc nhãn hiện tại qua API
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          HAS_FIX=$(gh api "repos/$REPO/pulls/$PR" --jq '([.labels[].name] | index("fix")) != null')
          echo "PR #$PR có nhãn fix: $HAS_FIX"
          echo "has_fix=$HAS_FIX" >> "$GITHUB_OUTPUT"

      # Bước này KHÔNG bao giờ dùng `if:` để bỏ qua (rà soát Z2/Z9 — một
      # step `skipped` im lặng trông giống hệt một step đã kiểm và đã qua).
      # Luôn chạy, tự in ra kết luận, và tự quyết định thoát 0 hay 1.
      - name: PR fix phải có test
        run: |
          set -euo pipefail
          if [ "${{ steps.labels.outputs.has_fix }}" != "true" ]; then
            echo "Không có nhãn fix, bỏ qua."
            exit 0
          fi
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '(^|/)(test|tests)/|\.test\.ts$'; then
            echo "Có thay đổi trong test."
          else
            echo "::error::PR gắn nhãn 'fix' nhưng không đụng file test nào. Bất biến I2 đòi một test TÁI HIỆN lỗi, viết trước khi sửa."
            exit 1
          fi

  protected-area:
    name: protected-area
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # BẤT BIẾN I4, sau quyết định D-C06: vùng bảo vệ có HAI mức.
      #
      #   owner-merge        · chỉ chủ dự án merge
      #   automerge-delayed  · máy merge sau 12 giờ CI xanh, nếu không có
      #                        comment `dừng` của chủ dự án
      #
      # Luật phân loại nằm ở `ops/invariants.protected-area.ts`, KHÔNG nằm
      # trong file này. Lý do: `ci.yml` chạy theo định nghĩa trong nhánh PR,
      # nên một luật viết ở đây tự nó không chặn được gì. `automerge.yml`
      # chạy cùng luật đó theo bản trên `main` và ĐÓ mới là lớp chặn thật
      # (rà soát Z8). Nhãn gắn ở đây là để người đọc PR.
      #
      # Cũng gắn nhãn mềm `cross-lane` khi PR chạm nhiều thư mục làn
      # (CHARTER mục 4) — chỉ để reviewer soát kỹ hơn, không chặn.
      # Nhãn phải tồn tại trước khi gắn. Nguồn sự thật là ops/labels.json;
      # bước này chỉ bảo đảm năm nhãn mà chính CI dùng đã có mặt, để job
      # không đỏ vì một lý do không liên quan gì tới nội dung PR.
      - name: Bảo đảm nhãn CI dùng đã tồn tại
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for NAME in owner-merge automerge-delayed automerge cross-lane fix; do
            ROW=$(jq -c --arg n "$NAME" '.labels[] | select(.name==$n)' ops/labels.json)
            gh label create "$NAME" --repo "$REPO" \
              --color "$(echo "$ROW" | jq -r .color)" \
              --description "$(echo "$ROW" | jq -r .description)" --force
          done

      - name: Gắn nhãn theo cửa merge, và cross-lane
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"

          # CHARTER được cắt theo MỤC, không theo file: chỉ mục 1 (mục tiêu)
          # và mục 3 (bất biến) mới cần chủ dự án. Vì vậy luật cần cả bản cũ
          # lẫn bản mới để biết diff rơi vào mục nào.
          # Z9: CHARTER.md có thể chưa tồn tại ở SHA nền (repo rất cũ, hoặc
          # nhánh base lạ). Vắng file là hợp lệ — protected-area.ts đọc
          # `baseCharter === null` và coi như CHARTER.md chạm mục 1 hoặc 3,
          # tức cửa `owner-merge`, phương án an toàn nhất khi không đối chiếu
          # được (xem `charterSections === null` trong file đó).
          git show "origin/$BASE:CHARTER.md" > "$RUNNER_TEMP/base-CHARTER.md" 2>/dev/null || true

          AREA=$(node ops/invariants.protected-area.ts \
            --changed "$RUNNER_TEMP/changed.txt" \
            --head . \
            --base-charter "$RUNNER_TEMP/base-CHARTER.md")
          GATE=$(echo "$AREA" | jq -r .gate)

          # Cấm im lặng (rà soát Z2): bước này LUÔN in ra kết luận của nó.
          # Một bước có điều kiện mà không in gì thì nhìn từ ngoài giống hệt
          # một bước đã kiểm và đã qua.
          echo "::notice::cửa merge = $GATE"
          echo "$AREA" | jq -r '(.owner[] | "  owner-merge vì \(.)"), (.delayed[] | "  chờ vì \(.)")'

          # Gỡ một nhãn không có mặt không phải lỗi, và bước này phải chạy
          # được ở cả lần đầu lẫn các lần sau — một hàm dùng chung để chỉ cần
          # MỘT chỗ giải thích `|| true` cho toàn bộ khối dưới đây (rà soát Z9).
          rm_label() { gh pr edit "$PR" --remove-label "$1" || true; }

          case "$GATE" in
            owner-merge)
              gh pr edit "$PR" --add-label owner-merge
              rm_label automerge-delayed
              rm_label automerge
              ;;
            automerge-delayed)
              gh pr edit "$PR" --add-label automerge-delayed
              rm_label owner-merge
              rm_label automerge
              ;;
            *)
              rm_label owner-merge
              rm_label automerge-delayed
              ;;
          esac

          # Z9: `grep` trả 1 khi không khớp dòng nào, và dưới `set -o pipefail`
          # điều đó giết cả job — một PR không chạm thư mục làn nào sẽ làm
          # job gắn nhãn đỏ vì lý do không liên quan gì tới nội dung PR.
          LANES=$( (grep -Eo '^(workshops|ops/lanes)/[a-z]+' "$RUNNER_TEMP/changed.txt" || true) | sort -u | wc -l)
          echo "số làn bị chạm: $LANES"
          if [ "$LANES" -gt 1 ]; then
            gh pr edit "$PR" --add-label cross-lane
          else
            rm_label cross-lane
          fi

  trailer-warn:
    name: trailer-warn
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Giả định G14: commit của routine và thread mang trailer Claude-Session.
      # Job này LÀ cách kiểm G14 — đọc kết quả của nó trên các PR do routine mở.
      #
      # LUẬT MỀM (CHARTER mục 4): commit trên nhánh claude/ thiếu trailer
      # Claude-Session chỉ được CẢNH BÁO. Cố ý không chặn: nếu nền tảng đổi
      # cách ghi trailer thì một luật cứng ở đây sẽ chặn toàn bộ công việc.
      - name: Cảnh báo commit thiếu trailer Claude-Session
        # Z9: luật mềm (xem khối comment trên) — trailer thiếu chỉ cảnh báo,
        # không chặn PR, nên chính bước cảnh báo cũng không được phép đỏ CI.
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          RANGE="origin/${{ github.event.pull_request.base.ref }}..HEAD"
          MISSING=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -q '^Claude-Session:'; then
              echo "::warning::commit $sha thiếu trailer Claude-Session"
              MISSING=$((MISSING+1))
            fi
          done < <(git rev-list "$RANGE")
          echo "Thiếu trailer: $MISSING commit. Đây là cảnh báo, không chặn."
