# 🤖 Đẩy thông báo về điện thoại (CHARTER 2.4).
#
# GitHub không gửi thông báo cho chính người thực hiện hành động. Agent hành
# động bằng danh tính của chủ dự án, nên issue do agent mở sẽ KHÔNG báo về
# máy chủ dự án. Workflow này chạy bằng github-actions[bot] — một danh tính
# khác — nên @nhắc của nó mới đẩy được thông báo qua GitHub Mobile.
#
# ⚠️ PHẠM VI 1 — loại issue: từ D-C06, file này CHỈ @nhắc cho HAI thứ:
#   `digest` · bản tin sáng — hộp quyết định DUY NHẤT của chủ dự án
#   `alert`  · cảnh báo khẩn — bốn loại, khai ở CHARTER 2.4
#
# Nhãn `decision` đã bị BỎ khỏi danh sách này, và đó là thay đổi chính của
# D-C06. Trước đó mỗi issue `🤖 [QĐ]` đẩy một thông báo riêng về điện thoại,
# nên một ngày nhiều quyết định là một ngày nhiều lần bị gọi. Từ nay mọi
# quyết định `irreversible` xuất hiện dưới dạng MỘT DÒNG trong bản tin sáng,
# và chủ dự án trả lời tất cả trong MỘT comment trên issue bản tin
# ("#19 A, #14 B"). Issue `[QĐ]` vẫn được mở như cũ — nó là chỗ ghi bối cảnh
# và là chỗ agent đóng lại sau khi xử lý — chỉ là nó không còn gọi điện nữa.
#
# ⚠️ PHẠM VI 2 — nguồn issue: workflow này CHỈ phủ issue do NGƯỜI hoặc AGENT
# mở. Nó KHÔNG phủ issue do workflow khác mở, vì GitHub không kích hoạt
# workflow từ sự kiện do GITHUB_TOKEN tạo ra (KF-004). `watchdog.yml` và
# `main-ci.yml` vì thế tự đặt @nhắc ngay trong thân issue chúng mở, không
# nhờ file này.
#
# Đừng "sửa" bằng cách thêm gì đó ở đây — không có gì ở đây sửa được, vì
# file này không bao giờ được gọi trong trường hợp đó.
name: notify

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  issues: write

jobs:
  mention:
    name: mention
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.issue.labels.*.name, 'digest') ||
      contains(github.event.issue.labels.*.name, 'alert')
    steps:
      - name: Nhắc chủ dự án đúng một lần
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          OWNER: HungQuach301
          MARKER: '<!-- crux-notify -->'
        run: |
          set -euo pipefail
          if gh issue view "$NUM" --repo "$REPO" --json comments \
              --jq '.comments[].body' | grep -qF "$MARKER"; then
            echo "Đã nhắc rồi. Không nhắc lại."
            exit 0
          fi

          LABELS=$(gh issue view "$NUM" --repo "$REPO" --json labels --jq '[.labels[].name] | join(", ")')
          case "$LABELS" in
            *alert*) LEAD="Có cảnh báo khẩn cần anh xem.";;
            *)       LEAD="Bản tin sáng. Mọi việc cần anh nằm ở đây.";;
          esac

          # Comment này do github-actions[bot] viết, không phải agent. Nó
          # KHÔNG bắt đầu bằng 🤖 — và cũng không được coi là câu trả lời của
          # chủ dự án, vì agent chỉ đọc comment của chính chủ dự án (CHARTER 2.3).
          BODY=$(printf '%s\n' \
            "$MARKER" \
            "@$OWNER $LEAD" \
            "" \
            "Nhãn: $LABELS" \
            "" \
            "Trả lời bằng MỘT comment ngay trong issue này, dạng \`#19 A, #14 B\`. Comment của anh không có 🤖, nên agent nhận ra đó là câu trả lời của anh.")
          gh issue comment "$NUM" --repo "$REPO" --body "$BODY"
