# 🤖 Đồng bộ hệ thống nhãn GitHub từ ops/labels.json (CHARTER mục 9).
#
# Nhãn được định nghĩa trong repo, không đặt tay trên giao diện. Lý do: CI
# và automerge.yml dựa vào tên nhãn để quyết định merge hay không (bất biến
# I2, I4). Một nhãn bị đổi tên bằng tay sẽ làm hai cơ chế đó im lặng ngừng
# hoạt động — không có gì đỏ, chỉ là không có gì xảy ra.
name: labels

on:
  push:
    branches: [main]
    paths: ['ops/labels.json']
  workflow_dispatch:
    inputs:
      # P-010 · chế độ chạy thử. `smoke-workflows.yml` gọi file này kèm
      # `dry_run=true` sau mỗi lần `ops/workflows/**` đổi trên `main`, để
      # lỗi quyền / lỗi lệnh `gh` lộ ra ngay thay vì nằm im tới lần
      # `ops/labels.json` đổi kế tiếp (KF-003 xảy ra đúng ở file này).
      dry_run:
        description: 'Chạy thử: in ra nhãn ĐỊNH đồng bộ, không ghi gì lên repo'
        type: boolean
        default: false

permissions:
  # contents: read LÀ BẮT BUỘC vì job này dùng actions/checkout. Khi một
  # workflow khai khối `permissions`, mọi quyền KHÔNG liệt kê bị đặt thành
  # `none` — kể cả `contents`. Với repo private, GITHUB_TOKEN không đọc được
  # repo sẽ làm checkout báo "Repository not found" (404, không phải 403:
  # GitHub trả 404 để không lộ việc repo có tồn tại hay không). Xem KF-003.
  contents: read
  # issues: write — nhãn của repo nằm dưới quyền Issues, không phải Pull requests.
  issues: write

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tạo hoặc cập nhật từng nhãn
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          # Chạy thử vẫn phải CÓ GIÁ TRỊ: nó đọc `ops/labels.json` thật,
          # chạy `jq` thật, và in ra từng nhãn nó ĐỊNH ghi. Một chế độ thử
          # chỉ in "ok" thì không kiểm được gì ngoài việc runner khởi động.
          if [ "$DRY_RUN" = "true" ]; then
            echo "CHẠY THỬ — không ghi nhãn nào lên repo $REPO."
          fi
          jq -c '.labels[]' ops/labels.json | while read -r row; do
            NAME=$(echo "$row" | jq -r .name)
            COLOR=$(echo "$row" | jq -r .color)
            DESC=$(echo "$row" | jq -r .description)
            if [ "$DRY_RUN" = "true" ]; then
              echo "ĐỊNH ghi: $NAME (màu $COLOR) — $DESC"
              continue
            fi
            gh label create "$NAME" --repo "$REPO" --color "$COLOR" --description "$DESC" --force
            echo "đã đồng bộ: $NAME"
          done
          # Cố ý KHÔNG xoá nhãn lạ. Xoá nhãn làm mất nó khỏi mọi issue và PR
          # đang mang nó, và việc đó không hoàn tác được.
