# 🤖 Tự đóng issue `🤖 [QĐ]` khi việc gắn với nó đã xong (mục `platform/P-050`).
#
# Chỉ dẫn **D3** của chủ dự án, nguyên văn trên `#131` lúc `2026-09-24T23:54:32Z`
# (sao sang `#251`):
#
#   Đóng #234, #175, #169, #88, #70, #73; kèm link PR hoặc commit chứng minh đã
#   xử lý. Từ nay [QĐ] tự đóng khi việc gắn với nó đã xong.
#
# Vế *"từ nay"* là một luật, và chuẩn của chủ dự án cho luật đã chốt ở câu trả
# lời `#169`: *"tất cả thành bài kiểm máy khoá được, không phải lời dặn"*. File
# này là cái máy đó.
#
# ⚠️ PHẦN QUYẾT ĐỊNH KHÔNG NẰM Ở ĐÂY. Nó ở `ops/scripts/decision-close.ts`, có
# `pnpm test` khoá. Workflow này chỉ làm hai việc mà một hàm thuần không làm
# được: gom dữ liệu từ API, và đăng/đóng. Cùng khuôn `alert-escalation.ts` ·
# `heartbeat-source.ts`, và cùng một lẽ — một phép so nằm trong khối `run:` chỉ
# kiểm được bằng cách để nó chạy sai thật.
#
# ⚠️ LUẬT ĐỌC TÊN PR CHỈ CÓ MỘT BẢN. Bước dựng ảnh chụp gọi
# `decision-close.ts --linked-prs` chứ KHÔNG chép biểu thức `\bPR\s*\[?#(\d+)`
# sang `jq`. Mục `P-043` đã trả giá cho bài học này một lần: hằng
# `STEP0_REF_PATTERN` có một bản chép tay trong YAML, và bản chép lệch thật
# (thiếu hai tiền tố) mà không gì đỏ.
#
# ⚠️ MỖI LẦN ĐÓNG ĐỀU ĐỂ LẠI BẰNG CHỨNG. Comment đi TRƯỚC lệnh đóng, và nó
# mang đúng các dòng `evidence` của phán quyết — đúng chữ *"kèm link PR hoặc
# commit chứng minh đã xử lý"*. Đóng sai thì mở lại được, và phán quyết dựng
# lại được từ cùng dữ liệu.
#
# Hướng lệch ở đây KHÔNG đối xứng, nên mặc định nghiêng về giữ: đóng thừa một
# `[QĐ]` còn chờ người là xoá một câu hỏi chặn đường (bản tin chỉ đọc issue
# đang mở), còn giữ thừa một `[QĐ]` đã xong chỉ là một dòng rác thấy ngay.
name: decision-close

on:
  schedule:
    # 20:00 UTC, ngay TRƯỚC bản tin sáng (phụ lục P2 chạy 20:30 theo số đo
    # thật của mục `B12`). Thứ tự đó là chủ đích: bản tin đếm "cần anh quyết"
    # từ các issue đang mở, nên dọn trước khi đếm thì con số nó gửi tới chủ dự
    # án là con số đúng. Dọn sau thì bản tin vẫn báo thừa đủ 24 giờ nữa.
    - cron: '0 20 * * *'
  # P-010 · gọi tay được, để `smoke-workflows.yml` chạy thử file này sau mỗi
  # lần nó đổi trên `main`.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử: in phán quyết, KHÔNG comment và KHÔNG đóng issue nào'
        type: boolean
        default: true

# `pull-requests: read` là BẮT BUỘC, không phải cho chắc: bước đo trạng thái PR
# gọi `gh api repos/…/pulls/N`, và quyền đó KHÔNG nằm trong `contents: read`.
# Khai khối `permissions` thì mọi quyền không liệt kê thành `none`, nên thiếu nó
# là 403 — mà lời gọi có lưới `|| echo ''`, nên 403 trông y hệt "`#N` không phải
# PR". Đó là lần thứ hai của chữ ký `KF-017` (lần đầu: thiếu `checks: read` ở
# `automerge.yml`, 35 lượt đỏ / 0 PR merge trong ~5,9 giờ), nên `CLAUDE.md` mục
# 13 đòi sửa cả **tầng luật**: `ops/scripts/check-workflows.ts` nay có một luật
# quyền cho `gh api …/pulls/`, và `ops/scripts/decision-close.ts` khai riêng
# `unmeasuredPrs` để "chưa đo được" không đi tiếp thành "không có gì cản".
permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    name: close
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'

      - name: Dựng ảnh chụp, quyết định, rồi đóng
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: HungQuach301
          # Lượt theo lịch chạy THẬT; chỉ lượt gọi tay mới mặc định chạy thử.
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          # ── Lượt 1: mọi issue nhãn `decision` đang mở, kèm comment.
          #    `--json comments` của `gh issue list` không trả mảng comment ở
          #    mọi phiên bản, nên lấy danh sách số trước rồi `gh api` từng cái.
          gh issue list --repo "$REPO" --label decision --state open \
            --limit 200 --json number --jq '.[].number' > numbers.txt
          echo "issue nhãn decision đang mở: $(wc -l < numbers.txt)"

          # `docs/decisions/` là nguồn bằng chứng thứ ba, và việc ĐỌC nó nằm
          # trong script (`markDecisionDocs`) chứ không phải một `grep` ở đây:
          # bản đầu grep cả file và khớp 7/7 số thử, vì `D-C06.md` in ví dụ
          # định dạng trả lời `#19 A, #14 B` và `D-C07.md` dẫn `#120` làm bối
          # cảnh. Chỗ đúng để neo là dòng `- **Nguồn:**`, và luật đó có bài
          # kiểm. Ở đây chỉ còn việc nối file lại.
          cat docs/decisions/*.md > decision-docs.txt 2>/dev/null || : > decision-docs.txt

          echo '{"issues":[]}' > snapshot.json
          while read -r NUM; do
            [ -n "$NUM" ] || continue
            gh api "repos/$REPO/issues/$NUM" > "issue-$NUM.json"
            # `--paginate` in MỘT MẢNG CHO MỖI TRANG (đúng cái bẫy
            # `automerge.yml` đã ghi lại), nên `--jq '.[]'` tãi từng comment
            # thành dòng rồi `jq -s` gộp lại một mảng duy nhất. Thiếu bước này
            # thì chỉ trang ĐẦU được đọc, và mọi issue > 30 comment im lặng mất
            # bằng chứng — tức đúng các `[QĐ]` sống lâu.
            gh api "repos/$REPO/issues/$NUM/comments?per_page=100" --paginate --jq '.[]' \
              | jq -s '.' > "comments-$NUM.json"
            jq -n \
              --slurpfile issue "issue-$NUM.json" \
              --slurpfile comments "comments-$NUM.json" \
              '{
                 number: $issue[0].number,
                 title: ($issue[0].title // ""),
                 body: ($issue[0].body // ""),
                 labels: [$issue[0].labels[]?.name],
                 comments: [$comments[0][]? | {
                   author: (.user.login // ""),
                   body: (.body // ""),
                   createdAt: (.created_at // "")
                 }],
                 linkedPrs: [],
                 hasDecisionDoc: false
               }' > "snap-$NUM.json"
            jq --slurpfile one "snap-$NUM.json" \
              '.issues += $one' snapshot.json > snapshot.next && mv snapshot.next snapshot.json
          done < numbers.txt

          # ── Lượt 2: đo trạng thái từng PR mà các issue nêu tên. Luật đọc
          #    tên PR lấy TỪ SCRIPT, không chép sang jq (xem đầu file).
          node ops/scripts/decision-close.ts --linked-prs snapshot.json > prs.txt
          echo "PR cần đo: $(wc -l < prs.txt)"
          echo '[]' > prstate.json
          while read -r PR; do
            [ -n "$PR" ] || continue
            # Một số `#N` sau chữ `PR` có thể là issue chứ không phải PR, hoặc
            # đã bị xoá. `|| echo ''` ở đây là chủ đích: KHÔNG đo được phải về
            # "chưa biết" (bỏ khỏi `linkedPrs`) chứ không về "đã đo và chưa
            # merge" — hai thứ đó dẫn tới hai phán quyết khác nhau, và gộp
            # chúng là để một issue xong vẫn bị giữ mãi mà không ai biết vì sao.
            RAW=$(gh api "repos/$REPO/pulls/$PR" 2>/dev/null || echo '')
            if [ -z "$RAW" ]; then
              echo "  #$PR — không đọc được như một PR, bỏ qua (chưa biết ≠ chưa merge)"
              continue
            fi
            printf '%s' "$RAW" | jq '{
                number: .number,
                merged: (.merged_at != null),
                closed: (.state == "closed")
              }' > "pr-$PR.json"
            jq --slurpfile one "pr-$PR.json" '. += $one' prstate.json > prstate.next
            mv prstate.next prstate.json
          done < prs.txt

          # ── Lượt 3: ghép trạng thái đã đo vào từng issue. Việc ghép cũng
          #    nằm trong script (`attachLinkedPrs`), KHÔNG phải một biểu thức
          #    `jq` chép tay — nếu không thì luật đọc tên PR lại có hai bản,
          #    đúng chỗ đầu file đã nói.
          node ops/scripts/decision-close.ts --attach-prs prstate.json snapshot.json > snapshot.next
          mv snapshot.next snapshot.json
          node ops/scripts/decision-close.ts --mark-docs decision-docs.txt snapshot.json > snapshot.next
          mv snapshot.next snapshot.json

          # ── Phán quyết.
          node ops/scripts/decision-close.ts snapshot.json "$OWNER" > verdict.json
          jq -r '"tổng \(.total) · đóng \(.close|length) · giữ \(.keep|length)"' verdict.json
          jq -r '.keep[] | "  GIỮ  #\(.issue) — \(.reason)"' verdict.json
          jq -r '.close[] | "  ĐÓNG #\(.issue) — \(.reason)"' verdict.json

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY_RUN — không comment, không đóng issue nào."
            exit 0
          fi

          # ── Đăng bằng chứng TRƯỚC, rồi mới đóng. Thứ tự đó là chủ đích: một
          #    lần đóng không có bằng chứng là một lần đóng không được phép
          #    (chỉ dẫn D3), nên nếu bước comment hỏng thì `set -e` dừng lượt
          #    và issue ở lại — hướng lệch an toàn.
          #    Thân comment lấy TỪ `verdict.json` (`closeComment` của script),
          #    không dựng lại bằng `jq` — xem đầu file.
          jq -c '.close[]' verdict.json > closing.jsonl
          while read -r ONE; do
            [ -n "$ONE" ] || continue
            NUM=$(printf '%s' "$ONE" | jq -r '.issue')
            printf '%s' "$ONE" | jq -r '.comment' > body.md
            gh issue comment "$NUM" --repo "$REPO" --body-file body.md
            gh issue close "$NUM" --repo "$REPO" --reason completed
            echo "đã đóng #$NUM"
          done < closing.jsonl

          # ── Báo vào chỗ chủ dự án THẬT SỰ đọc.
          #
          # Comment bằng chứng ở trên nằm trên issue đã ĐÓNG, và
          # `ops/scripts/digest-metrics.ts` gọi `gh issue list --state open
          # --label decision` — nên bản tin không bao giờ đi qua đó. Nếu dừng ở
          # đây thì lớp an toàn "đóng sai thì thấy được" không tồn tại, và một
          # hành động `reversible` do máy tự làm mất cửa sổ `hoàn tác #N` 24 giờ
          # mà CHARTER 2.3 và 2.5 đòi.
          #
          # Nên mỗi lượt có đóng thật phải để lại một dòng trên issue bản tin
          # đang mở (nhãn `digest`) — đúng mục "Đã tự làm", đúng hộp quyết định
          # duy nhất.
          COUNT=$(jq -r '.close | length' verdict.json)
          if [ "$COUNT" = "0" ]; then
            echo "không đóng issue nào — không báo bản tin."
            exit 0
          fi
          DIGEST=$(gh issue list --repo "$REPO" --label digest --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$DIGEST" ]; then
            # Không có bản tin đang mở là chuyện bình thường (bản tin hôm trước
            # đã đóng, hôm nay chưa mở). KHÔNG tạo issue mới: `notify.yml` sẽ
            # @nhắc chủ dự án cho một issue nhãn `digest` mới, tức gọi anh ngoài
            # nhịp vì một việc máy tự lo. Lượt bản tin kế tiếp tự đọc các issue
            # vừa đóng.
            echo "không có issue bản tin đang mở — bỏ qua bước báo (không tạo issue mới)."
            exit 0
          fi
          {
            printf '%s\n\n' "🤖 **Đã tự làm — đóng $COUNT issue \`[QĐ]\` có việc đã xong** (mục \`platform/P-050\`, chỉ dẫn D3)."
            jq -r '.close[] | "- #\(.issue) — \(.reason)"' verdict.json
            printf '\n%s\n' "Đây là `reversible`: phủ quyết bằng \`hoàn tác #N\` trong 24 giờ, hoặc mở lại issue — máy sẽ **không** đóng lại (nó đọc mốc tự đóng cũ)."
          } > digest-note.md
          gh issue comment "$DIGEST" --repo "$REPO" --body-file digest-note.md
          echo "đã báo vào bản tin #$DIGEST"
